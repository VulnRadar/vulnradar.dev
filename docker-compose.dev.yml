# VulnRadar Development Docker Compose
#
# Builds the app image from the local Dockerfile instead of pulling the
# published ghcr.io image, so local source changes are actually reflected.
# Referenced from docker-compose.yml's header comment and from the
# architecture docs (app/docs/architecture), kept in sync with those.
#
# Quick start:
#   1. Copy .env.example to .env and fill in values
#   2. docker compose -f docker-compose.dev.yml up -d --build
#
# The schema creates itself on first boot.
#
# For the production path (pull the published image), use docker-compose.yml
# instead.

services:
  postgres:
    image: postgres:16.15-alpine
    container_name: vulnradar-db-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vulnradar}
      POSTGRES_USER: ${POSTGRES_USER:-vulnradar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vulnradar}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - vulnradar-network-dev

  app:
    build:
      context: .
      dockerfile: Dockerfile
      # The same set as docker-compose.yml, and tests/repo/compose-parity.test.ts
      # keeps it that way: a NEXT_PUBLIC_* value only reaches the browser bundle
      # if it is passed here.
      args:
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
        NEXT_PUBLIC_DISCORD_INVITE_URL: ${NEXT_PUBLIC_DISCORD_INVITE_URL:-}
        NEXT_PUBLIC_CHROME_WEB_STORE_URL: ${NEXT_PUBLIC_CHROME_WEB_STORE_URL:-}
        NEXT_PUBLIC_FIREFOX_ADDON_URL: ${NEXT_PUBLIC_FIREFOX_ADDON_URL:-}
    container_name: vulnradar-app-dev
    stop_grace_period: 40s
    # Same shape as docker-compose.yml: env_file forwards the whole .env
    # (SMTP, Turnstile, OAuth, support address and the rest), and the map
    # below only sets what compose derives itself or defaults, taking
    # precedence where both define a key. The map used to list a
    # `NAME: ${NAME:-}` line per optional variable instead, which forwarded
    # only those few and turned every unset one into an empty string.
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-vulnradar}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vulnradar}
      DATABASE_SSL: "false"
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      # Required, same as production: an empty value crash-loops the container
      # on the startup env validation instead of failing here with a name.
      API_KEY_ENCRYPTION_KEY: ${API_KEY_ENCRYPTION_KEY:?Set API_KEY_ENCRYPTION_KEY in .env to 64 hex chars. Generate one with the node command at the top of docker-compose.yml.}
      SMTP_PORT: ${SMTP_PORT:-587}
      HOST_BIND: ${HOST_BIND:-127.0.0.1}
    volumes:
      # Mirrors docker-compose.yml's avatar_data / backup_data volumes: keeps
      # uploaded profile pictures and database backups out of the
      # (build-time-baked) public/ dir and off the container's throwaway
      # writable layer.
      - avatar_data_dev:/app/data/avatars
      - backup_data_dev:/app/backups
    ports:
      - "${HOST_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/api/v3/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - vulnradar-network-dev

volumes:
  postgres_data_dev:
    driver: local
  avatar_data_dev:
    driver: local
  backup_data_dev:
    driver: local

networks:
  vulnradar-network-dev:
    driver: bridge
