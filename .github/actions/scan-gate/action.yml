name: "VulnRadar Scan Gate"
description: "Scan a URL with VulnRadar and fail the workflow if findings cross a severity threshold."
author: "VulnRadar"
branding:
  icon: "shield"
  color: "blue"

inputs:
  url:
    description: "The URL to scan."
    required: true
  api-key:
    description: "VulnRadar API token (Profile > Developer > API Keys). Store as a repo secret, never hardcode it."
    required: true
  api-base-url:
    description: "Base API URL. Override for a self-hosted deployment."
    required: false
    default: "https://vulnradar.dev/api/v3"
  crawl:
    description: "If true, crawl and scan several pages of the site instead of scanning just the one URL. How many is your plan's crawl page limit."
    required: false
    default: "false"
  max-critical:
    description: "Fail the gate if the scan reports more than this many critical findings."
    required: false
    default: "0"
  max-high:
    description: "Fail the gate if the scan reports more than this many high findings."
    required: false
    default: "0"
  max-medium:
    description: "Fail the gate if the scan reports more than this many medium findings. -1 disables this check."
    required: false
    default: "-1"
  include-suppressed:
    description: "If true, count findings you marked as false positives toward the thresholds. Off by default, matching the dashboard and the SARIF report."
    required: false
    default: "false"
  fail-on-incomplete:
    description: "What to do when part of the target was not checked. blocking (the default) exits 3 when the site showed the scanner a bot challenge or the page could not be fetched, because a scan that never saw the page proves nothing. any also exits 3 when any other area was skipped. never only reports what was skipped."
    required: false
    default: "blocking"
  timeout-seconds:
    description: "Give up waiting for the scan after this many seconds. Left unset it follows the scan: the server's single-scan budget, or its much larger crawl budget when crawl is true."
    required: false
    default: ""
  poll-interval-seconds:
    description: "Seconds to wait between status polls."
    required: false
    default: "5"
  sarif-file:
    description: "Where to write the SARIF report. Feed this to github/codeql-action/upload-sarif to get the findings into the repository's Security tab. Set to an empty string to skip the download."
    required: false
    default: "vulnradar.sarif"

outputs:
  scan-id:
    description: "The VulnRadar scan id."
    value: ${{ steps.scan.outputs.scan-id }}
  sarif-file:
    description: "Path the SARIF report was written to, empty if the download was skipped or failed."
    value: ${{ steps.scan.outputs.sarif-file }}
  critical:
    description: "Number of critical findings."
    value: ${{ steps.scan.outputs.critical }}
  high:
    description: "Number of high findings."
    value: ${{ steps.scan.outputs.high }}
  medium:
    description: "Number of medium findings."
    value: ${{ steps.scan.outputs.medium }}
  low:
    description: "Number of low findings."
    value: ${{ steps.scan.outputs.low }}
  total:
    description: "Total number of findings."
    value: ${{ steps.scan.outputs.total }}
  incomplete:
    description: "Comma-separated areas the scan did not check, such as bot-challenge, page-unreachable or dns. Empty when it checked everything."
    value: ${{ steps.scan.outputs.incomplete }}

runs:
  using: "composite"
  steps:
    - id: scan
      shell: bash
      env:
        VR_URL: ${{ inputs.url }}
        VR_API_KEY: ${{ inputs.api-key }}
        VR_API_BASE: ${{ inputs.api-base-url }}
        VR_CRAWL: ${{ inputs.crawl }}
        VR_MAX_CRITICAL: ${{ inputs.max-critical }}
        VR_MAX_HIGH: ${{ inputs.max-high }}
        VR_MAX_MEDIUM: ${{ inputs.max-medium }}
        VR_INCLUDE_SUPPRESSED: ${{ inputs.include-suppressed }}
        VR_FAIL_ON_INCOMPLETE: ${{ inputs.fail-on-incomplete }}
        VR_TIMEOUT: ${{ inputs.timeout-seconds }}
        VR_POLL_INTERVAL: ${{ inputs.poll-interval-seconds }}
        VR_SARIF_FILE: ${{ inputs.sarif-file }}
      run: |
        set -euo pipefail

        # Exit codes match the vulnradar CLI: 1 when the scan ran and a
        # threshold was exceeded, 2 when it could not run, 3 when it ran but
        # did not check the target (a bot challenge, or the page could not be
        # fetched). A failed gate wins over 3.

        if [ -z "$VR_API_KEY" ]; then
          # The dollar sign comes in through printf: the runner expands an
          # expression anywhere in this script before bash runs it, a
          # backslash does not stop it, and a composite action has no secrets
          # context to expand it from.
          printf '::error::api-key is empty. Pass it from a repo secret, e.g. %s{{ secrets.VULNRADAR_TOKEN }}.\n' '$'
          exit 2
        fi

        # Checked before the scan is started and charged. A threshold that is
        # not a number made the comparisons below error out, and an errored
        # test inside `if` is just false, so the gate passed.
        for pair in "max-critical:$VR_MAX_CRITICAL" "max-high:$VR_MAX_HIGH"; do
          case "${pair#*:}" in
            ''|*[!0-9]*)
              echo "::error::${pair%%:*} must be 0 or more, got '${pair#*:}'."
              exit 2
              ;;
          esac
        done
        # An empty max-medium means "no medium check", like the default. Any
        # negative number disables it, as it does in the CLI: only a value that
        # is not a number is refused.
        if [ -z "$VR_MAX_MEDIUM" ]; then
          VR_MAX_MEDIUM=-1
        fi
        case "${VR_MAX_MEDIUM#-}" in
          ''|*[!0-9]*)
            echo "::error::max-medium must be a number (a negative one disables the check), got '$VR_MAX_MEDIUM'."
            exit 2
            ;;
        esac
        case "$VR_INCLUDE_SUPPRESSED" in
          true|false) ;;
          *)
            echo "::error::include-suppressed must be true or false, got '$VR_INCLUDE_SUPPRESSED'."
            exit 2
            ;;
        esac
        case "$VR_FAIL_ON_INCOMPLETE" in
          blocking|any|never) ;;
          *)
            echo "::error::fail-on-incomplete must be blocking, any or never, got '$VR_FAIL_ON_INCOMPLETE'."
            exit 2
            ;;
        esac

        if [ "$VR_CRAWL" = "true" ]; then
          endpoint="$VR_API_BASE/scan/crawl"
        else
          endpoint="$VR_API_BASE/scan"
        fi

        # jq builds the body: a URL interpolated into a JSON string broke the
        # request on the first double quote or backslash in it.
        create_body_json=$(jq -n --arg url "$VR_URL" '{url: $url}')
        create_response=$(curl -sS -w '\n%{http_code}' -X POST "$endpoint" \
          -H "Authorization: Bearer $VR_API_KEY" \
          -H "Content-Type: application/json" \
          -d "$create_body_json" || printf '\n000')
        create_status="${create_response##*$'\n'}"
        create_body="${create_response%$'\n'*}"

        # Exit codes match the vulnradar CLI: 2 when the scan could not run,
        # 1 only when it ran and a threshold was exceeded.
        if [ "$create_status" -ge 300 ] || [ "$create_status" = "000" ]; then
          echo "::error::Failed to start scan (HTTP $create_status): $create_body"
          exit 2
        fi

        scan_id=$(echo "$create_body" | jq -r '.scanId')
        if [ -z "$scan_id" ] || [ "$scan_id" = "null" ]; then
          echo "::error::No scanId in response: $create_body"
          exit 2
        fi
        echo "Started scan $scan_id for $VR_URL"
        echo "scan-id=$scan_id" >> "$GITHUB_OUTPUT"

        # POST /scan runs as a background job -- it returns {scanId, status}
        # immediately, never findings/summary. The result only shows up once
        # GET /scan/status/{id} reports status=completed.
        elapsed=0
        status="running"
        result=""
        # An unset timeout follows the scan, matching cli/lib.mjs.
        #
        # This defaulted to 300 whatever the mode, and a crawl runs under a
        # much larger server-side budget, so `crawl: true` in a workflow
        # reported "Timed out after 300s" and failed the build for a crawl the
        # server still had minutes left to finish, which then completed
        # normally and landed in the user's history. The CLI hit exactly this
        # and fixed it; the Action its own README points people at did not.
        if [ -z "${VR_TIMEOUT:-}" ]; then
          if [ "$VR_CRAWL" = "true" ]; then
            VR_TIMEOUT=900
          else
            VR_TIMEOUT=300
          fi
        fi

        failures=0
        while [ "$elapsed" -lt "$VR_TIMEOUT" ]; do
          status_response=$(curl -sS -w '\n%{http_code}' \
            -H "Authorization: Bearer $VR_API_KEY" \
            "$VR_API_BASE/scan/status/$scan_id" || printf '\n000')
          status_code="${status_response##*$'\n'}"
          status_body="${status_response%$'\n'*}"

          if [ "$status_code" = "401" ] || [ "$status_code" = "403" ]; then
            echo "::error::Not authorized to read scan $scan_id (HTTP $status_code)."
            exit 2
          fi
          # One 502 from a proxy used to fail the build for a scan that was
          # succeeding. Up to five failures in a row are retried, as the CLI does.
          if [ "$status_code" -ge 300 ] || [ "$status_code" = "000" ]; then
            failures=$((failures + 1))
            if [ "$failures" -gt 5 ]; then
              echo "::error::Lost contact with the API while polling scan $scan_id (HTTP $status_code): $status_body"
              exit 2
            fi
            echo "::warning::Status poll failed (HTTP $status_code); retrying ($failures/5)."
            sleep "$VR_POLL_INTERVAL"
            elapsed=$((elapsed + VR_POLL_INTERVAL))
            continue
          fi
          failures=0

          status=$(echo "$status_body" | jq -r '.status')

          if [ "$status" = "completed" ]; then
            result="$status_body"
            break
          fi
          if [ "$status" = "failed" ]; then
            error_reason=$(echo "$status_body" | jq -r '.error // "unknown error"')
            # Why it failed, when the API says. Appended last so the
            # "Scan failed: " prefix is unchanged, and an older server that
            # sends no kind adds nothing.
            failure_kind=$(echo "$status_body" | jq -r '(.failureKind | strings) // empty')
            if [ -n "$failure_kind" ]; then
              error_reason="$error_reason [$failure_kind]"
            fi
            echo "::error::Scan failed: $error_reason"
            exit 2
          fi

          sleep "$VR_POLL_INTERVAL"
          elapsed=$((elapsed + VR_POLL_INTERVAL))
        done

        if [ -z "$result" ]; then
          echo "::error::Timed out after ${VR_TIMEOUT}s waiting for scan $scan_id to complete."
          exit 2
        fi

        # Fail closed. A missing summary read as zeros would pass a response
        # this script did not understand, and a gate that cannot judge must
        # not pass.
        if ! echo "$result" | jq -e '(.result | type) == "object" and (.result.summary | type) == "object"' > /dev/null; then
          echo "::error::Scan $scan_id completed but its result has no summary object, so the thresholds cannot be judged."
          exit 2
        fi

        # The counts the gate judges, the same rule as the vulnradar CLI
        # (cli/lib.mjs gateCounts): taken from the findings, leaving out the
        # ones you marked a false positive unless include-suppressed is true.
        # The summary counts them, so gating on it failed the next run on a
        # finding the dashboard and the SARIF report had hidden. With no
        # findings array it falls back to the summary.
        gate_counts_jq='
          .result as $r
          | (if ($r.findings | type) == "array" then [$r.findings[] | objects] else null end) as $all
          | if $all == null then
              { critical: ($r.summary.critical // 0), high: ($r.summary.high // 0),
                medium: ($r.summary.medium // 0), low: ($r.summary.low // 0),
                total: ($r.summary.total // 0), suppressed: 0 }
            else
              [$all[] | select($inc or (.suppressed != true))] as $kept
              | { critical: ([$kept[] | select(.severity == "critical")] | length),
                  high: ([$kept[] | select(.severity == "high")] | length),
                  medium: ([$kept[] | select(.severity == "medium")] | length),
                  low: ([$kept[] | select(.severity == "low")] | length),
                  total: ($kept | length),
                  suppressed: (($all | length) - ($kept | length)) }
            end
        '
        counts=$(echo "$result" | jq -c --argjson inc "$VR_INCLUDE_SUPPRESSED" "$gate_counts_jq")
        critical=$(echo "$counts" | jq -r '.critical')
        high=$(echo "$counts" | jq -r '.high')
        medium=$(echo "$counts" | jq -r '.medium')
        low=$(echo "$counts" | jq -r '.low')
        total=$(echo "$counts" | jq -r '.total')
        suppressed=$(echo "$counts" | jq -r '.suppressed')

        # What the scan did not look at. bot-challenge and page-unreachable
        # mean the target was never read, so zero findings proves nothing.
        incomplete=$(echo "$result" | jq -r '[(.result.incomplete // [])[]? | strings] | join(",")')
        page_message=$(echo "$result" | jq -r '(.result.pageUnreachable | objects | .message | strings) // empty')
        redirect_host=$(echo "$result" | jq -r '(.result.pageUnreachable | objects | .redirectHost | strings) // empty')
        incomplete_blocking=false
        case ",$incomplete," in
          *,bot-challenge,*|*,page-unreachable,*) incomplete_blocking=true ;;
        esac
        if [ "$VR_FAIL_ON_INCOMPLETE" = "any" ] && [ -n "$incomplete" ]; then
          incomplete_blocking=true
        fi
        if [ "$VR_FAIL_ON_INCOMPLETE" = "never" ]; then
          incomplete_blocking=false
        fi

        echo "critical=$critical" >> "$GITHUB_OUTPUT"
        echo "high=$high" >> "$GITHUB_OUTPUT"
        echo "medium=$medium" >> "$GITHUB_OUTPUT"
        echo "low=$low" >> "$GITHUB_OUTPUT"
        echo "total=$total" >> "$GITHUB_OUTPUT"
        echo "incomplete=$incomplete" >> "$GITHUB_OUTPUT"

        {
          echo "### VulnRadar scan of $VR_URL"
          echo ""
          echo "| Severity | Count |"
          echo "|---|---|"
          echo "| Critical | $critical |"
          echo "| High | $high |"
          echo "| Medium | $medium |"
          echo "| Low | $low |"
          echo "| Total | $total |"
          if [ "$suppressed" -gt 0 ]; then
            echo "| Suppressed by false-positive verdicts (not counted) | $suppressed |"
          fi
          if [ -n "$incomplete" ]; then
            echo "| Not checked | \`$incomplete\` |"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

        echo "Scan complete: critical=$critical high=$high medium=$medium low=$low total=$total"
        if [ "$suppressed" -gt 0 ]; then
          echo "$suppressed suppressed by false-positive verdicts, not counted (include-suppressed: true counts them)."
        fi
        if [ -n "$incomplete" ]; then
          echo "::warning::Not checked: $incomplete"
          if [ -n "$page_message" ]; then
            echo "::warning::Page unreachable: $page_message"
          fi
          if [ -n "$redirect_host" ]; then
            echo "::warning::It redirects to another host: $redirect_host"
          fi
        fi

        # The gate used to stop at these counts, so the findings themselves
        # never left the log: no annotations on the diff, nothing in the
        # repository's Security tab, which is where every comparable action
        # (ZAP, Nuclei, Snyk) puts them. The API already renders SARIF 2.1.0,
        # so it is one request away. Downloaded BEFORE the threshold check
        # below deliberately: a failing gate is exactly when you want the
        # findings uploaded, and a step that exits first never writes the
        # file. A download failure is a warning, not a gate failure: the
        # severity thresholds are the contract, the report is the evidence.
        echo "sarif-file=" >> "$GITHUB_OUTPUT"
        if [ -n "$VR_SARIF_FILE" ]; then
          sarif_status=$(curl -sS -o "$VR_SARIF_FILE" -w '%{http_code}' \
            -H "Authorization: Bearer $VR_API_KEY" \
            "$VR_API_BASE/history/$scan_id/report?format=sarif" || echo "000")
          if [ "$sarif_status" = "200" ]; then
            echo "sarif-file=$VR_SARIF_FILE" >> "$GITHUB_OUTPUT"
            echo "SARIF report written to $VR_SARIF_FILE"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "SARIF report: \`$VR_SARIF_FILE\` (upload it with github/codeql-action/upload-sarif to populate the Security tab)." >> "$GITHUB_STEP_SUMMARY"
          else
            rm -f "$VR_SARIF_FILE"
            echo "::warning::Could not download the SARIF report (HTTP $sarif_status). The severity gate below still applies."
          fi
        fi

        fail=false
        if [ "$critical" -gt "$VR_MAX_CRITICAL" ]; then
          echo "::error::$critical critical finding(s) exceed the max of $VR_MAX_CRITICAL"
          fail=true
        fi
        if [ "$high" -gt "$VR_MAX_HIGH" ]; then
          echo "::error::$high high finding(s) exceed the max of $VR_MAX_HIGH"
          fail=true
        fi
        if [ "$VR_MAX_MEDIUM" -ge 0 ] && [ "$medium" -gt "$VR_MAX_MEDIUM" ]; then
          echo "::error::$medium medium finding(s) exceed the max of $VR_MAX_MEDIUM"
          fail=true
        fi

        if [ "$fail" = "true" ]; then
          exit 1
        fi

        # After the thresholds, so a failed gate is reported as one.
        if [ "$incomplete_blocking" = "true" ]; then
          echo "::error::The scan did not check the target ($incomplete). A pass here would mean nothing was looked at. Set fail-on-incomplete: never to accept a partial scan."
          exit 3
        fi
