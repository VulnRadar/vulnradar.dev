# zizmor's configuration (the pinned image in .github/tools/Dockerfile), run
# at --min-severity medium over .github/workflows and .github/actions. An
# ignore names a file and a reason; there is no blanket disable.
rules:
  dangerous-triggers:
    ignore:
      # workflow_run is the trigger these two use on purpose: they run after
      # docker-publish.yml, and only for a push to this repository, which each
      # job's own `if:` and its "Resolve tag" step check before any write.
      # tests/repo/workflow-trust.test.ts runs both against forks, renamed
      # workflows, moved tags and branches named like tags.
      - release.yml
      - docker-publish-arm64.yml
  github-env:
    ignore:
      # The same two files, and the finding follows from the trigger above:
      # zizmor flags every GITHUB_ENV write in a workflow_run workflow. Each
      # write here is a tag or a package version that the same step matched
      # against an anchored pattern with no whitespace, quote or newline in
      # it, so it cannot add a line to the file.
      # tests/repo/workflow-hardening.test.ts fails on a write without one.
      - release.yml
      - docker-publish-arm64.yml
