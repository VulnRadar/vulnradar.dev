version: 2
updates:
  # npm dependencies (Next.js, React, TypeScript, shadcn, etc.)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Chicago"
    # The three-day rule: a version update waits three days after its release
    # before Dependabot proposes it, so a hijacked release that the registry pulls
    # within hours never reaches a pull request. Security updates are not held:
    # GitHub applies cooldown to version updates only.
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    labels:
      - "dependabot"
      - "dependencies"
    groups:
      # A next major is a migration, not a bump: Next 17 makes Cache Components
      # the default, and the move from 15 to 16 changed the bundler, the
      # config keys and the build checks. Review a next-stack PR like
      # that migration, and never merge one on a green run alone. next-intl
      # rides with it because its peer range and its Turbopack alias move with
      # next.
      next-stack:
        patterns:
          - "next"
          - "next-intl"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "eslint-config-next"
      stripe:
        patterns:
          - "stripe"
          - "@stripe/*"
      ui:
        patterns:
          - "@radix-ui/*"
          - "lucide-react"
          - "react-icons"
          - "tailwindcss"
          - "tailwindcss-animate"
          - "tailwind-merge"
          - "class-variance-authority"
          - "clsx"
      scanning:
        patterns:
          - "jspdf"
          - "jspdf-autotable"
          - "recharts"
          - "cmdk"
          - "embla-carousel-react"
          - "vaul"
          - "sonner"
          - "swr"
          - "react-day-picker"
          - "react-hook-form"
          - "react-resizable-panels"
          - "input-otp"
          - "date-fns"
          - "server-only"
      # No "bcrypt" pattern here: only bcryptjs is a dependency, so the bare
      # name matched nothing and made the group look wider than it was. `jose`
      # is in its place because it IS on the auth path (it verifies the ID
      # token on staff single sign-on) and was the one real security
      # dependency this group did not cover.
      security:
        patterns:
          - "bcryptjs"
          - "jose"
          - "jsonwebtoken"
          - "nodemailer"
          - "@neondatabase/serverless"
          - "pg"
          - "zod"
          - "@hookform/resolvers"
      # One PR for the linters. eslint-plugin-oxlint declares a peer of
      # oxlint@~<its own version>, so an oxlint bump on its own fails npm ci
      # and so does a plugin bump on its own: #413 and #416 sat red for that
      # reason until they were landed together by hand. ESLint and
      # typescript-eslint come along so a lint upgrade is one decision.
      lint:
        patterns:
          - "oxlint"
          - "eslint-plugin-oxlint"
          - "eslint"
          - "@eslint/*"
          - "@typescript-eslint/*"
          - "typescript-eslint"
      # No autoprefixer here: this project runs Tailwind v4's own pipeline
      # through @tailwindcss/postcss (see postcss.config.mjs) and
      # autoprefixer is not a dependency in any form, so the pattern only
      # ever matched nothing. Same reason dompurify left the `scanning`
      # group: it exists in the tree transitively under jspdf, never as a
      # declared dependency.
      build:
        patterns:
          - "postcss"
          - "typescript"
          - "@types/*"
          - "tslib"
      # vitest and @vitest/coverage-v8 pin each other exactly: the coverage
      # plugin's peer range is the one version of vitest it was released with,
      # not a caret range.
      # Ungrouped, dependabot opened one PR per package, and each was the
      # other's missing half: the vitest PR left coverage-v8 behind and the
      # coverage-v8 PR left vitest behind, so BOTH died on the same ERESOLVE
      # at `npm ci` before a single test ran. Two red PRs that could never go
      # green on their own, and no amount of re-running would have helped.
      # Grouped, they move as the one thing they actually are.
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
    ignore:
      # TypeScript majors are held until typescript-eslint supports them.
      # typescript-eslint 8.72.x declares typescript >=4.8.4 <6.1.0, and TS 7
      # no longer ships the compiler API that typescript-eslint and `next
      # build`'s type check load. Revisit when typescript-eslint ships TS 7
      # support.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # The browser extension is a separate package with its own lockfile, and
  # dependabot directories are NOT recursive, so the block above never saw
  # it: 194 packages with no advisory monitoring of any kind. Note the
  # absence of `--omit=dev` thinking here. Only 2 of those packages are
  # runtime deps; the other 191 are vite, rollup, esbuild, sharp and
  # archiver, which is the toolchain that emits content.js, the IIFE
  # injected into every page the user visits. For the extension the dev
  # tree IS the shipped tree, so all of it is watched.
  #
  # The other half of that separation, and the one that bites silently: npm
  # `overrides` are scoped to the manifest that declares them and to that
  # install tree only. The root package.json `overrides` block (postcss,
  # brace-expansion, minimatch, @typescript-eslint/*) does NOT reach
  # extension/package-lock.json, and the two trees have already diverged on
  # exactly that entry: postcss is 8.5.26 at the root, the pinned value, and
  # 8.5.23 in the extension, which still runs postcss on every build.
  # Nothing is exploitable at those versions today; the mechanism is the
  # finding (AUDIT-013#subdeps-05). So: WHEN YOU ADD AN ENTRY TO THE ROOT
  # `overrides` BLOCK IN REACTION TO AN ADVISORY, MIRROR IT INTO
  # extension/package.json, or the artifact that ships to users' browsers
  # keeps the vulnerable version and nothing reports it.
  - package-ecosystem: "npm"
    directory: "/extension"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Chicago"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    labels:
      - "dependabot"
      - "dependencies"
      - "extension"
    groups:
      extension-build:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # The same hold the root block puts on TypeScript majors, and for the
      # same reason (typescript-eslint caps typescript below 6.1.0): root
      # eslint parses `extension/src` too, because
      # `extension/**` is not in eslint.config.mjs's ignore list the way
      # `cli/**` is. Without this the two packages drift, and they already
      # did. Listing only minor and patch under `groups` does not ignore
      # majors, it only stops grouping them, so a TypeScript major arrived
      # here as its own PR and was merged while the root stayed pinned. The
      # extension ended up a major AHEAD of the app, and extension/README.md
      # spent that whole time telling contributors it was a major behind.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # web-ext, the linter CI runs over the built Firefox package the way AMO's
  # review does. It is its own package so its ~330-package tree stays out of
  # extension/, whose dev tree is the one that emits content.js. Nothing in it
  # ships; it is watched so the linter does not fall behind AMO's rules.
  - package-ecosystem: "npm"
    directory: "/.github/tools/web-ext"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Chicago"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 2
    labels:
      - "dependabot"
      - "dependencies"
    groups:
      web-ext:
        patterns:
          - "*"

  # Base images: the Dockerfile's node:22.x-alpine (build + runner stages),
  # plus postgres:16.x-alpine in both compose files. The Dockerfile's FROM
  # lines carry tag@sha256:digest, and Dependabot moves the two together, so
  # the digest cannot go stale behind the tag. Registry rebuilds of the same
  # tag also arrive as a PR, which is the point of pinning the digest.
  # Every one of those pins is deliberate and commented "bump intentionally",
  # but nothing opened the bump PR that assumed a human would remember, so
  # the pins drifted a year behind published CVE fixes on their own. Patch
  # and minor bumps land as PRs like any other dependency; majors are held
  # so a Node or Postgres line change is a decision, not a merge.
  #
  # tests/spike/Dockerfile models the production image for the routing spike
  # and must carry the same node pin: scripts/spike/selftest.mjs fails when it
  # does not. Listing both directories makes Dependabot move them in one PR.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/tests/spike"
      # The CI tools (actionlint, zizmor, hadolint, gitleaks, grype, ZAP) and
      # the two references workflows repeat: the services Postgres and the
      # publish jobs' BuildKit. A workflow names an image Dependabot cannot
      # see, so .github/tools/Dockerfile names it where it can.
      #
      # That makes Dependabot NOTICE a new postgres or buildkit, not land it.
      # It cannot edit a workflow's `image:` or `driver-opts:`, and
      # tests/repo/workflow-hardening.test.ts requires those to equal the
      # stage, so a postgres or moby/buildkit PR from here fails Test until
      # someone pushes the rest of the bump onto its branch: the `image:` of
      # every Postgres service (ci.yml, docker-publish-arm64.yml,
      # image-arm64.yml) for postgres, the `driver-opts:` of
      # docker-publish.yml and docker-publish-arm64.yml for buildkit. A
      # postgres tag change also arrives a second time from the
      # docker-compose block below, which updates docker-compose.yml's tag;
      # land both in one branch and close the other PR. A red check here
      # means the follow-up commit is missing, not that the bump is wrong,
      # and the auto-merge gate leaves it for a person either way.
      - "/.github/tools"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Chicago"
    cooldown:
      default-days: 3
    labels:
      - "dependabot"
      - "docker"
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]

  # Compose files are a separate ecosystem from the Dockerfile: the docker
  # ecosystem above only reads Dockerfiles.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Chicago"
    cooldown:
      default-days: 3
    labels:
      - "dependabot"
      - "docker"
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]

  # GitHub Actions themselves: the workflows, and any composite action under
  # .github/actions (scan-gate has no `uses:` today; this watches for one).
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Chicago"
    cooldown:
      default-days: 3
    labels:
      - "dependabot"
      - "github-actions"
    groups:
      actions:
        patterns:
          - "*"
