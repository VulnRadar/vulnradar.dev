# ZAP baseline rules, one per line: <rule id> TAB <FAIL|WARN|IGNORE> TAB <name>.
# zap-baseline.py runs only the passive rules, against the container the job
# boots on a network with no way out (.github/workflows/site-checks.yml).
# A rule that is not listed is WARN. A FAIL rule that fires on the first run is
# fixed in the app, or moved to IGNORE below with its reason in the name
# column: never silently to WARN.
#
# The app is served over plain HTTP in the sandbox and the job adds
# X-Forwarded-Proto: https to every request, so it answers as it does behind
# its TLS terminator and the HSTS and Secure cookie rules can be FAIL.
10020	FAIL	Missing Anti-clickjacking Header
10021	FAIL	X-Content-Type-Options Header Missing
10038	WARN	CSP Header Not Set, or a Report-Only CSP found. One rule id covers both and this file cannot tell them apart, so the job's next step fails on any 10038 alert but the Report-Only one: the app sends a report-only Trusted Types policy beside its enforced CSP on purpose (middleware.ts).
10035	FAIL	Strict-Transport-Security Header Not Set
10010	FAIL	Cookie No HttpOnly Flag
10011	FAIL	Cookie Without Secure Flag
10054	FAIL	Cookie without SameSite Attribute
10037	FAIL	Server Leaks Information via "X-Powered-By" HTTP Response Header Field(s)
10098	FAIL	Cross-Domain Misconfiguration
10055	IGNORE	CSP: style-src unsafe-inline. The framework needs inline styles; tests/selfscan accepts it as csp-framework-required, with its reason.
