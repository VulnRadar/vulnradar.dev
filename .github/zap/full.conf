# ZAP full-scan rules, one per line: <rule id> TAB <FAIL|WARN|IGNORE> TAB <name>.
# zap-full-scan.py runs the passive and the active rules against the container
# the job boots on a network with no way out. An IGNORE row disables the rule
# and carries its reason in the name column. The job fails on any High alert
# whose rule is not IGNORE here (see .github/workflows/site-checks.yml).
#
# The rules that call third-party interaction servers are off: nothing the
# scan finds is worth sending a string off the runner for, and the sandbox
# has no route out for them anyway.
40043	IGNORE	Log4Shell. Needs an out-of-band callback to a third-party interaction server.
40046	IGNORE	Server Side Request Forgery. Needs an out-of-band callback to a third-party interaction server.
10055	IGNORE	CSP: style-src unsafe-inline. The framework needs inline styles; tests/selfscan accepts it as csp-framework-required, with its reason.
