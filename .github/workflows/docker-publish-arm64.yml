name: Publish ARM64 Image

# release: arm64, built after the release rather than in front of it.
#
# This used to be one `platforms: linux/amd64,linux/arm64` build on the tag
# workflow. GitHub's hosted amd64 runners ran the arm64 leg under QEMU: on
# v3.8.0 it spent over 40 minutes on `npm ci` alone, before even reaching
# `npm run build`, and because release.yml waits on docker-publish, the GitHub
# release sat unpublished the entire time. A 4.5 minute release became an
# hour-plus one for an architecture almost no self-hoster is on.
#
# So docker-publish.yml now publishes amd64 immediately and the release goes
# out. This workflow builds arm64 afterwards and folds it into the SAME tags as
# a proper multi-arch index, so `docker compose up -d` on a Pi, an Apple
# Silicon box or an Ampere VPS still resolves. The only difference a consumer
# sees is that arm64 appears a little after the release instead of holding it
# up, and `docker pull` on arm64 in that window fails the way it did before
# multi-arch existed at all.
#
# It runs on a NATIVE arm64 runner, which is why there is no QEMU setup step.
# Emulation was not just slow, it was unreliable in a way that cost nothing to
# detect and everything to wait out: on v3.8.2 QEMU died 35 seconds into the
# build with "uncaught target signal 4 (Illegal instruction) - core dumped",
# and then the job HUNG rather than failing, because BuildKit went on waiting
# for a process that was already gone. It sat there for 3 hours 21 minutes and
# was only stopped by hand; with no timeout on the job it would have run to
# GitHub's 6 hour default. Native runners remove that entire class of failure
# and bring the build back to roughly amd64 speed. timeout-minutes below is the
# backstop for anything else that ever wedges: successful builds under QEMU
# took 22 to 28 minutes, and a native build should be a fraction of that, so
# 45 minutes is generous and still fails visibly instead of silently burning a
# runner for a quarter of a day.

on:
  # Primary path: the amd64 publish succeeded, so there is an index to add to.
  workflow_run:
    workflows: ["Build, Sign, and Publish Docker Image"]
    types:
      - completed
  # Manual re-run, for a tag whose arm64 leg failed or was cancelled.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish arm64 for (e.g. v3.8.0)"
        required: true
        type: string

concurrency:
  group: docker-arm64-${{ github.event.workflow_run.head_branch || inputs.tag }}
  cancel-in-progress: true

jobs:
  arm64:
    # Only when the amd64 publish actually succeeded. A failed or cancelled
    # run means there is no index to merge into, and pushing arm64 on its own
    # would leave the tag resolving for arm64 and nothing else.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      # cosign keyless needs the ambient OIDC token, same as docker-publish.
      id-token: write

    steps:
      - name: Resolve tag
        id: vars
        env:
          # security: untrusted event fields go in via env, never interpolated
          # into the script body. Same rule as release.yml.
          EVENT_NAME: ${{ github.event_name }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$RUN_HEAD_BRANCH"
          fi
          # workflow_run fires for every push to this workflow's triggers,
          # including branches. Only tags publish images.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::notice::${TAG:-<empty>} is not a version tag; nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Checkout repository
        if: steps.vars.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The tag, not the default branch: workflow_run checks out the
          # default branch by default, which would build whatever main has
          # moved on to rather than what was released.
          ref: ${{ steps.vars.outputs.tag }}
          fetch-depth: 0
          # security: a workflow_run job holds this repository's secrets, so it
          # must not leave an authenticated git remote behind for a later step
          # (or a Docker build of the checked-out tree) to find. Nothing here
          # pushes with git; the registry push authenticates separately.
          #
          # The ref itself is gated to a ^vX.Y.Z tag by the step above, and
          # docker-publish only fires on a tag push to this repository, which a
          # fork cannot do. This closes the credential half regardless.
          persist-credentials: false

      - name: Set up Docker Buildx
        if: steps.vars.outputs.skip != 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        if: steps.vars.outputs.skip != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image reference
        if: steps.vars.outputs.skip != 'true'
        id: image
        run: |
          set -euo pipefail
          # OCI references must be lowercase; the org context mirrors display
          # casing, which is not guaranteed to be.
          OWNER_LC=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "ref=ghcr.io/${OWNER_LC}/vulnradar" >> "$GITHUB_OUTPUT"

      - name: Build and push the arm64 image
        if: steps.vars.outputs.skip != 'true'
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          # Its own arch-suffixed tag, not the release tag. Pushing straight to
          # :VERSION would replace the amd64 image already published there and
          # leave amd64 users unable to pull, for the whole build.
          tags: ${{ steps.image.outputs.ref }}:${{ steps.vars.outputs.tag }}-arm64
          # Scoped separately from amd64: one shared scope makes the two legs
          # evict each other and neither ever hits. mode=max stores the
          # intermediate `npm ci` layer, which is the expensive one and which
          # mode=min would not keep. This is what stops the next arm64 build
          # repeating the 40 minutes.
          cache-from: type=gha,scope=buildkit-arm64
          cache-to: type=gha,mode=max,scope=buildkit-arm64
          provenance: mode=max
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || 'https://vulnradar.dev' }}

      - name: Merge both architectures into the release tags
        if: steps.vars.outputs.skip != 'true'
        id: merge
        env:
          REF: ${{ steps.image.outputs.ref }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          set -euo pipefail

          # Resolve the amd64 image to a DIGEST before doing anything, and
          # merge from that digest rather than from the tag. The tag is both a
          # source and a destination here, so reading it after the first
          # `imagetools create` would read the half-merged result: the second
          # target would be built from different inputs than the first. Pinning
          # the digest makes every target come from exactly the same two
          # images.
          AMD64_DIGEST=$(docker buildx imagetools inspect "${REF}:${TAG}" --format '{{ .Manifest.Digest }}')
          echo "amd64 image: ${REF}:${TAG}@${AMD64_DIGEST}"

          # :latest moves only if it already points at this version's image.
          # docker-publish.yml owns that decision (a backport must not steal
          # :latest); this preserves it rather than second-guessing it.
          # Compared before the merge, for the same reason as above.
          TARGETS=("${REF}:${TAG}")
          if docker buildx imagetools inspect "${REF}:latest" >/dev/null 2>&1; then
            LATEST_DIGEST=$(docker buildx imagetools inspect "${REF}:latest" --format '{{ .Manifest.Digest }}')
            if [ "${LATEST_DIGEST}" = "${AMD64_DIGEST}" ]; then
              TARGETS+=("${REF}:latest")
            else
              echo "::notice::latest points at a different image; leaving it alone."
            fi
          fi

          for T in "${TARGETS[@]}"; do
            echo "merging into ${T}"
            docker buildx imagetools create -t "${T}" \
              "${REF}@${AMD64_DIGEST}" \
              "${REF}:${TAG}-arm64"
          done

          # The merged index has a new digest. cosign signs by digest, so the
          # signature docker-publish made covers the amd64-only image and NOT
          # this index: without signing again, `cosign verify` on the tag fails
          # for everyone.
          DIGEST=$(docker buildx imagetools inspect "${REF}:${TAG}" --format '{{ .Manifest.Digest }}')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Merged index: ${REF}:${TAG}@${DIGEST}"
          docker buildx imagetools inspect "${REF}:${TAG}"

      - name: Install cosign
        if: steps.vars.outputs.skip != 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the merged index
        if: steps.vars.outputs.skip != 'true'
        env:
          REF: ${{ steps.image.outputs.ref }}
          DIGEST: ${{ steps.merge.outputs.digest }}
        run: |
          set -euo pipefail
          # By digest, so the signature covers the index itself and survives
          # any later tag move, exactly as docker-publish.yml signs.
          cosign sign --yes "${REF}@${DIGEST}"

      - name: Summary
        if: steps.vars.outputs.skip != 'true'
        env:
          REF: ${{ steps.image.outputs.ref }}
          TAG: ${{ steps.vars.outputs.tag }}
          DIGEST: ${{ steps.merge.outputs.digest }}
        run: |
          {
            echo "### arm64 published"
            echo ""
            echo "\`${REF}:${TAG}\` is now a multi-arch index (amd64 + arm64)."
            echo ""
            echo "Digest: \`${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
