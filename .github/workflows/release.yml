name: Attach Release Artifacts

# release: when a tagged release exists (or is being published),
# download the SBOM + signing artifacts produced by the docker-publish
# workflow and attach them to the GitHub Release. Also create a
# source tarball with sha256sums and a cosign signature so consumers
# can verify integrity without trusting the GitHub release host.
#
# Triggers (both fire idempotently):
#   1. workflow_run: docker-publish completed (primary path)
#   2. release: {published}: user published a release manually
#
# Both paths resolve to the same tag, then:
#   - waits for the SBOM artifact to be available in GH Actions storage
#     (if release: published fires before docker-publish has uploaded
#     its artifact, the download is retried)
#   - checks whether a release for the tag exists
#   - creates it if not, otherwise attaches to the existing one
#   - idempotent: re-running on the same tag updates the same release
#
# Self-hosters verifying a release can do:
#
#   # Verify the sums file itself FIRST, then the hashes in it. The sums
#   # file and the artifacts it describes come from the same host, so on
#   # its own it proves nothing; the cosign bundle is what anchors it.
#   cosign verify-blob \
#     --bundle sha256sums.txt.cert \
#     --certificate-identity-regexp 'https://github.com/<owner>/vulnradar.dev' \
#     --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
#     sha256sums.txt
#
#   # Verify the source tarball (and the extension zips + SBOMs, which are
#   # covered by the signed sums file rather than signed individually)
#   curl -sL https://github.com/<owner>/vulnradar.dev/releases/download/vX.Y.Z/sha256sums.txt | \
#     sha256sum -c -
#
#   # Verify the cosign signature (keyless, tied to GitHub Actions OIDC)
#   cosign verify-blob \
#     --bundle vulnradar-vX.Y.Z.tar.gz.cert \
#     --signature vulnradar-vX.Y.Z.tar.gz.sig \
#     --certificate-identity-regexp 'https://github.com/<owner>/vulnradar.dev' \
#     --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
#     vulnradar-vX.Y.Z.tar.gz
#
#   # Verify the Docker image
#   cosign verify \
#     --certificate-identity-regexp 'https://github.com/<owner>/vulnradar.dev/.github/workflows/docker-publish.yml' \
#     --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
#     ghcr.io/<owner>/vulnradar:vX.Y.Z

on:
  workflow_run:
    workflows: ["Build, Sign, and Publish Docker Image"]
    types:
      - completed
  release:
    types:
      - published

# Cancel any in-flight run on the same tag. If the user publishes
# the release and docker-publish completes in quick succession, only
# one of these will run for the same tag.
concurrency:
  group: release-attach-${{ github.event.workflow_run.head_branch || github.event.release.tag_name }}
  cancel-in-progress: true

jobs:
  release:
    # release: only build the GitHub release when the upstream Docker
    # publish succeeded (workflow_run path) OR the release was
    # published by a human (release: published path).
    if: >-
      github.event_name == 'release' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required for cosign keyless signing of the source tarball
      # (OIDC token exchange) -- same reasoning as docker-publish.yml.
      # Without this, cosign gets no ambient GitHub Actions OIDC token
      # and falls back to an interactive device-code flow that just
      # times out after 5 minutes in CI.
      id-token: write

    steps:
      - name: Resolve tag
        id: vars
        env:
          # security: pass untrusted event fields in via env, never
          # interpolate ${{ }} directly into the script body below --
          # head_branch/tag_name reach here from the triggering event and
          # a value containing shell metacharacters could otherwise break
          # out of string context and execute as code (CodeQL
          # actions/code-injection/critical). env-var substitution can't
          # do that: the value is only ever read as a plain string.
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          # workflow_run.head_branch is the tag for tag pushes -- NOT
          # GITHUB_REF_NAME, which on a workflow_run-triggered job
          # reflects this workflow file's own ref (the default branch,
          # e.g. "main"), not the ref that triggered the upstream
          # workflow. For the release: published trigger, the tag is
          # in the event payload.
          if [ "$EVENT_NAME" = "release" ]; then
            TAG="$RELEASE_TAG_NAME"
          else
            TAG="$WORKFLOW_RUN_HEAD_BRANCH"
          fi
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Workflow: $EVENT_NAME"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        # release: needed to build the browser extension below. Same
        # pin as ci.yml (Node 22 LTS, see package.json#engines).
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22.23.2"

      - name: Build + package browser extension
        # release: the workflow_run trigger does NOT check out the tagged
        # commit (actions/checkout on a workflow_run event defaults to the
        # default branch) -- git archive against ${TAG} explicitly, same
        # reasoning the source-tarball step below already uses, so the
        # packaged extension always matches what's actually tagged even if
        # main has moved on by the time this job runs.
        #
        # Zips are written straight into the same ARTIFACT_DIR the tarball
        # step below uses (created here since this step runs first), not
        # GITHUB_WORKSPACE, so the tarball step's own `sha256sum *.zip`
        # (added below) and the final `cp -v ./* "${GITHUB_WORKSPACE}/"`
        # pick them up automatically -- one artifact directory, one place
        # that decides what ships.
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          set -euo pipefail
          ARTIFACT_DIR="${RUNNER_TEMP}/release-artifacts"
          mkdir -p "${ARTIFACT_DIR}"

          EXT_DIR="${RUNNER_TEMP}/extension-src"
          mkdir -p "${EXT_DIR}"
          git archive "${TAG}" -- extension | tar -x -C "${EXT_DIR}"
          cd "${EXT_DIR}/extension"
          npm ci
          npm run build:chrome
          npm run build:firefox
          EXT_VERSION=$(node -p "require('./package.json').version")
          echo "EXT_VERSION=${EXT_VERSION}" >> "$GITHUB_ENV"
          cd dist-chrome && zip -r "${ARTIFACT_DIR}/vulnradar-chrome-v${EXT_VERSION}.zip" . && cd ..
          cd dist-firefox && zip -r "${ARTIFACT_DIR}/vulnradar-firefox-v${EXT_VERSION}.zip" . && cd ..

      - name: Pack the CLI tarball
        # The release already ships the extension; the CLI was the one
        # first-party artifact you could not get from the release page, even
        # though it is the piece a CI pipeline consumes. npm is the primary
        # install path, but a tarball attached here means an airgapped or
        # registry-pinned consumer can fetch exactly what a given tag shipped
        # and verify it against sha256sums.txt like everything else.
        #
        # Packed from `git archive` of the TAG rather than the checkout, for
        # the same reason the extension is: it guarantees the artifact matches
        # what was actually tagged. The CLI has no dependencies, so there is
        # nothing to install first.
        # security: TAG arrives as an environment variable, never as a
        # ${{ }} substitution inside the script body. See the note at the top
        # of the "Resolve tag" step: the value originates in event data, so
        # interpolating it lets a tag name inject shell.
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          set -euo pipefail
          ARTIFACT_DIR="${RUNNER_TEMP}/release-artifacts"
          mkdir -p "${ARTIFACT_DIR}"

          CLI_DIR="${RUNNER_TEMP}/cli-src"
          rm -rf "${CLI_DIR}"
          mkdir -p "${CLI_DIR}"
          git archive "${TAG}" -- cli | tar -x -C "${CLI_DIR}"
          cd "${CLI_DIR}/cli"

          CLI_VERSION=$(node -p "require('./package.json').version")
          echo "CLI_VERSION=${CLI_VERSION}" >> "$GITHUB_ENV"

          # --pack-destination writes straight into ARTIFACT_DIR. npm names
          # the file after the package, which would put vulnradar-0.1.1.tgz
          # next to vulnradar-v3.8.0.tar.gz: near-identical names carrying
          # unrelated versions. Renamed to match the extension's convention so
          # it is obvious which artifact is which.
          npm pack --pack-destination "${ARTIFACT_DIR}"
          mv "${ARTIFACT_DIR}/vulnradar-${CLI_VERSION}.tgz" \
             "${ARTIFACT_DIR}/vulnradar-cli-v${CLI_VERSION}.tgz"
          ls -l "${ARTIFACT_DIR}"/vulnradar-cli-*.tgz

      - name: Generate extension SBOM (CycloneDX, JSON)
        # release: docker-publish.yml's SBOM is generated against the server
        # IMAGE, so it describes nothing about the two extension zips
        # attached to this same release: separate package, separate
        # lockfile, none of it inside the image. SECURITY.md calls the
        # release SBOM a full bill of materials, which was only true of half
        # the release. This scans the extension source tree (node_modules
        # included, since npm ci has already run there) and writes into the
        # same ARTIFACT_DIR, so the sha256sums step below picks it up with
        # the *.cdx.json glob it already has.
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: ${{ runner.temp }}/extension-src/extension
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/release-artifacts/vulnradar-extension-v${{ env.EXT_VERSION }}.sbom.cdx.json
          # The file is attached to the release directly below; there is no
          # second workflow that needs to download it as an Actions artifact.
          upload-artifact: false

      - name: Download image SBOM (with retry)
        id: sbom_download
        # release: if the user publishes the release while docker-publish
        # is still running, the SBOM artifact may not exist yet. Retry
        # up to 5 times (5 minutes total) so the manual-publish flow
        # works without the user having to time docker-publish.
        #
        # infra: the artifact name must match what anchore/sbom-action
        # actually uploads (its own `artifact-name` input), not a
        # separate "release-artifacts" bundle -- sbom-action generates
        # and uploads the SBOM itself; it never lands in the checkout
        # for a later step to re-upload under a different name.
        #
        # infra: only attempted on the workflow_run path. `run-id` reads
        # github.event.workflow_run.id, which is EMPTY on the
        # `release: published` trigger, so on the manual-publish path this
        # step was asking for an artifact from run "" and failing every
        # time. continue-on-error then swallowed it, `shopt -s nullglob`
        # expanded *.cdx.json to nothing, and the release simply came out
        # one asset short with a green tick. The `if` stops the impossible
        # attempt; the check in "Build artifact list" below makes a genuine
        # miss on the primary path loud instead of silent.
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: vulnradar-${{ steps.vars.outputs.tag }}.sbom.cdx.json
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/downloaded
          # download-artifact v4 retries 5x with 10s delay on 404
        # Kept so a genuine race (the artifact still uploading) does not
        # abandon the whole release; the absence is reported below rather
        # than ignored.
        continue-on-error: true

      - name: Install cosign
        # release: pin cosign to a specific release tag (v2.4.1 is
        # the current Sigstore cosign at the time of writing). The
        # cosign-installer action pulls the binary by tag.
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Create source tarball + SHA256SUMS + cosign sign
        # release: produce a source tarball of the tagged commit and
        # sign it with cosign (keyless, Sigstore Fulcio + Rekor). The
        # detached signature and certificate are released alongside
        # the tarball so consumers can verify integrity without
        # trusting the GitHub release host.
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          set -euo pipefail
          ARTIFACT_DIR="${RUNNER_TEMP}/release-artifacts"
          mkdir -p "${ARTIFACT_DIR}"

          # git archive must run while cwd is still inside the checkout
          # (this step runs before any `cd` away from it) -- writing
          # straight into ARTIFACT_DIR via an absolute -o path, rather
          # than cd-ing there first, which would leave the working
          # directory outside any git repository.
          git archive --format=tar.gz \
            --prefix="vulnradar-${TAG}/" \
            -o "${ARTIFACT_DIR}/vulnradar-${TAG}.tar.gz" \
            "${TAG}"

          cd "${ARTIFACT_DIR}"

          # Copy the SBOM if docker-publish uploaded it.
          if [ -f "${{ runner.temp }}/downloaded/vulnradar-${TAG}.sbom.cdx.json" ]; then
            cp "${{ runner.temp }}/downloaded/vulnradar-${TAG}.sbom.cdx.json" .
          fi

          # Build the SHA256SUMS file. If the SBOM is missing
          # (release: published fired before docker-publish uploaded
          # it), the user can re-run this job after docker-publish
          # completes and the SHA256SUMS will be regenerated. *.zip
          # covers the extension packages the previous step wrote into
          # this same directory.
          #
          # infra: nullglob so a pattern with no matches (e.g. *.cdx.json
          # when the SBOM download above didn't find anything) expands to
          # nothing instead of the literal pattern string -- sha256sum
          # would otherwise fail on the literal "*.cdx.json" filename,
          # and with pipefail that silently kills this whole step (the
          # old `2>/dev/null` hid the message but not the exit code).
          shopt -s nullglob
          # *.tgz is the CLI: npm pack emits that extension, not .tar.gz, so
          # without it the tarball would ship unverifiable.
          SUM_FILES=(*.tar.gz *.tgz *.zip *.cdx.json)
          shopt -u nullglob
          sha256sum "${SUM_FILES[@]}" | sort -k2 > sha256sums.txt
          cat sha256sums.txt

          # Cosign signature bundle over the source tarball. Recent
          # cosign versions default to the unified bundle format:
          # --output-signature is deprecated and silently ignored, the
          # .cert file already contains the certificate, signature,
          # and Rekor entry needed for `cosign verify-blob --bundle`.
          cosign sign-blob --yes \
            --bundle "vulnradar-${TAG}.tar.gz.cert" \
            "vulnradar-${TAG}.tar.gz"

          # Sign the sums file too. Without this, sha256sums.txt was an
          # unsigned manifest fetched from the same host as the artifacts it
          # describes, so on a machine without cosign (lib/updater/cosign.ts
          # soft-skips there, which it names as the common case) the
          # "checksum verified" path compared a tarball against a file an
          # attacker who could alter release assets would simply alter too.
          # A signed sums file is the anchor that makes the checksum check
          # mean something on its own: verify this bundle, then trust every
          # hash in the file, including the extension zips and the SBOMs
          # which are not individually signed.
          cosign sign-blob --yes \
            --bundle "sha256sums.txt.cert" \
            "sha256sums.txt"

          # Move to workspace for the upload step.
          cp -v ./* "${GITHUB_WORKSPACE}/"

      - name: Build artifact list
        id: files
        env:
          TAG: ${{ steps.vars.outputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          ARTIFACTS=()
          for f in \
            "vulnradar-${TAG}.tar.gz" \
            "vulnradar-${TAG}.tar.gz.cert" \
            "vulnradar-chrome-v${EXT_VERSION}.zip" \
            "vulnradar-firefox-v${EXT_VERSION}.zip" \
            "vulnradar-extension-v${EXT_VERSION}.sbom.cdx.json" \
            "vulnradar-cli-v${CLI_VERSION}.tgz" \
            "sha256sums.txt" \
            "sha256sums.txt.cert"; do
            if [ -f "$f" ]; then
              ARTIFACTS+=("$f")
            fi
          done
          # SECURITY.md promises a CycloneDX SBOM with every tagged release,
          # and this used to be the one place that could quietly not deliver
          # one: the download above failed, nullglob swallowed the missing
          # file, and the release shipped an asset short with nothing said.
          # On the workflow_run path the image SBOM must exist, so its
          # absence is a hard failure. On the manual release: published
          # path it legitimately does not exist yet (the later workflow_run
          # run attaches it), so that is a warning.
          if [ -f "vulnradar-${TAG}.sbom.cdx.json" ]; then
            ARTIFACTS+=("vulnradar-${TAG}.sbom.cdx.json")
          elif [ "${EVENT_NAME}" = "workflow_run" ]; then
            echo "::error::Image SBOM vulnradar-${TAG}.sbom.cdx.json is missing. docker-publish.yml uploaded no artifact under that name, so this release would ship without the SBOM SECURITY.md documents."
            exit 1
          else
            echo "::warning::Image SBOM not attached on this manual-publish run; docker-publish.yml will attach it when it completes."
            echo "Image SBOM not yet available on this run (manual publish)." >> "$GITHUB_STEP_SUMMARY"
          fi
          printf '%s\n' "${ARTIFACTS[@]}" > files.txt
          echo "Will attach:"
          cat files.txt
          # infra: this step previously never wrote a step output, so
          # the "Find or create GitHub release" step's ARTIFACTS env
          # (steps.files.outputs.files) was always empty and every
          # release would ship with zero files attached.
          echo "files=${ARTIFACTS[*]}" >> "$GITHUB_OUTPUT"

      - name: Find or create GitHub release
        # release: idempotent. If the user already published the
        # release (release: published fired first), upload to the
        # existing release. If not (workflow_run fired first),
        # create a new release with auto-generated notes.
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.vars.outputs.tag }}
          ARTIFACTS: ${{ steps.files.outputs.files }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; will upload assets."
            gh release upload "${TAG}" ${ARTIFACTS} --clobber
          else
            echo "Creating release ${TAG}."
            NOTES=$(mktemp)
            PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
            if [ -n "${PREV_TAG}" ]; then
              git log --pretty=format:"- %s" "${PREV_TAG}..${TAG}" > "${NOTES}"
            else
              echo "Initial release." > "${NOTES}"
            fi
            # release: a tag with a suffix (v3.8.0-rc.1, v1.9.4-patch.1) is
            # not a stable release. Without --prerelease it became the
            # repository's "latest release", which is what
            # app/api/version/route.ts polls, so every self-hosted instance
            # was offered a release candidate or an old-line backport as an
            # upgrade. GitHub excludes prereleases from /releases/latest.
            PRERELEASE=""
            case "${TAG}" in
              *-*) PRERELEASE="--prerelease" ;;
            esac
            gh release create "${TAG}" \
              --title "${TAG}" \
              --notes-file "${NOTES}" \
              ${PRERELEASE} \
              ${ARTIFACTS}
            rm -f "${NOTES}"
          fi
          gh release view "${TAG}" --json url -q .url > release_url.txt
          echo "release_url=$(cat release_url.txt)" >> $GITHUB_OUTPUT

      - name: Summary
        env:
          # security: pipe external values through env vars instead
          # of inline-expanding them in the shell. Stops CodeQL
          # actions/code-injection (the release URL is set by an
          # earlier step from gh output, not user input, but the
          # pattern is identical to the vulnerable one and CodeQL
          # flags it).
          RELEASE_TAG: ${{ steps.vars.outputs.tag }}
          RELEASE_URL: ${{ steps.release.outputs.release_url }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "Tag: ${RELEASE_TAG}"
          echo "URL: ${RELEASE_URL}"
          echo "Trigger: ${EVENT_NAME}"
          echo "Artifacts:"
          cat files.txt
