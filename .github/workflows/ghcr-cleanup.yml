name: GHCR Cleanup

# Prunes leftover ghcr.io/<owner>/vulnradar image versions that
# docker-publish.yml leaves behind: every release push there also signs
# the image with cosign (a separate registry object per signed tag), and
# any build a tag later moved away from -- e.g. a re-run while debugging
# the release pipeline -- is left in the registry with nothing pointing
# at it anymore.
#
# delete-untagged removes those orphaned image builds. delete-orphaned-images
# removes cosign signatures/attestations, but ONLY once their parent image
# is already gone -- it never touches a signature for a still-tagged,
# still-pullable release.
#
# registry-retention: this used to run with no age cutoff, on the reasoning
# that a digest with no tag pointing at it is orphaned the moment it is
# created. That reasoning ignored the operators. docker-compose.yml tells
# self-hosters to pin immutably by digest, and a release-pipeline re-run
# produces a new digest, moves vX.Y.Z and latest onto it, and leaves the
# digest those operators pinned untagged -- and therefore in scope. They
# then got `manifest unknown` on the next pull or container restart, with
# no way to recover the image they were running. `older-than` keeps a
# month of orphans around so anyone who pinned recently can still pull,
# while the pruning this workflow exists for still happens.
#
# Runs weekly. workflow_dispatch defaults to a dry run (log only, delete
# nothing) so you can preview what it would remove before trusting it --
# pass dry_run: false to actually run it on demand.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only -- log what would be deleted, delete nothing"
        type: boolean
        default: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Delete orphaned/untagged image versions
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: vulnradar
          delete-untagged: true
          delete-orphaned-images: true
          older-than: 30 days
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          log-level: info
