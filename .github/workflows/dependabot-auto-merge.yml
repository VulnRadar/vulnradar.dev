name: Auto-merge Dependabot PRs

# Auto-merge PATCH dependabot updates only, and only once CI has actually
# gone green. Minor and major updates wait for a human: the `next-stack` and
# `ui` groups bundle several packages per PR, and a minor bump inside one of
# those is exactly the change worth reading. The header used to promise patch
# AND minor while the condition below only ever tested for patch, so every
# minor bump sat waiting with no explanation. Now the two agree.
#
# This used to call `gh pr merge --auto`, which does NOT wait for CI: it waits
# for the pull request to become mergeable under the branch's protection
# rules. `main` has no required status checks (see the enforcement note at the
# top of ci.yml), so under `--auto` a patch bump merged the instant it opened,
# with lint, typecheck, test and build still queued. A compromised patch
# release of any runtime dependency would have landed on main unreviewed and
# untested, and the next `v*` tag would have published it. The gate below
# waits for every other check on the pull request to finish and refuses to
# merge unless they all passed, so the promise in this header holds on its own
# rather than depending on repository settings nobody has configured yet.
#
# Finished is not the same as all there. A check CI has not registered yet is
# absent, not pending, so the wait used to merge once the checks visible so
# far were done: a fast one (Apply labels) that passed before CI queued its
# jobs read as "everything passed". The gate now also waits for CI's own run
# on the head to finish green, and for every check .github/rulesets/main.json
# requires to be among the checks that succeeded.
#
# When required status checks DO get configured on `main`, this gate stays
# correct: it is strictly stronger than what protection would enforce.
#
# The review rule is a different matter. .github/rulesets/main.json requires
# one approving code-owner review and has no bypass actors, and this job
# approves nothing (the token's bot is not a code owner anyway). Once that
# ruleset is imported, GitHub refuses the merge below, so a green patch bump
# waits for a code owner's approval like any other pull request and this
# job only reports that its checks passed. Keeping auto-merge after the
# import is an owner decision: a bypass actor, or an approval path, in the
# ruleset. tests/repo/rulesets.test.ts fails if the ruleset and this note
# stop agreeing.
#
# security: the gate reads the checks of the head this run was started for,
# and the merge names that same head. `gh pr checks` read whatever the pull
# request's head was at each poll, and `gh pr merge` merged whatever it was
# at the end, so a push that turned a patch bump into a minor or major one
# while the wait ran could be merged on the strength of the patch's checks.
# A newer push now also cancels this run (the concurrency group below).
#
# A merge made with this job's token starts no workflow on main, so the merge
# commit never got a CI run, and a tag on it failed docker-publish's CI gate
# after its 45-minute wait (#460, #465, #463 and #453 have none). The last
# step asks for one by workflow_dispatch, which a GITHUB_TOKEN may start.
#
# Override with the `dependabot-merge-ignore` label.

on:
  pull_request:
    types: [opened, reopened, synchronize]

# One run per pull request. A new push cancels the older run, so a run that
# started on a patch bump cannot go on to merge a head that has since become
# something else.
concurrency:
  group: dependabot-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Nothing at the top level: the job states its own scopes.
permissions: {}

jobs:
  dependabot-merge:
    name: Auto-merge patch updates
    runs-on: ubuntu-latest
    # Longer than the wait loop's own 85-minute ceiling. The ceiling has to
    # outlast the slowest chain of jobs a Dependabot pull request can start:
    # Site checks runs on every root package.json, package-lock.json or
    # Dockerfile bump, and its Lighthouse job (55 minutes) only starts after
    # the image build (25), so 80 minutes before it reports. At 45 the gate
    # gave up on every such patch bump while Lighthouse was still running.
    # tests/repo/workflow-trust.test.ts derives that chain from the
    # workflows and fails when a job grows past the ceiling. The job sits
    # at the 90-minute cap every workflow job is held to, so a chain that
    # grows past 85 has to get shorter rather than this wait longer.
    timeout-minutes: 90
    # The pull request's author, GitHub's documented check for Dependabot.
    # github.actor is whoever caused this particular event, which is not the
    # same question: Dependabot is the actor when it pushes to the branch of a
    # pull request someone else opened (a fork can arrange that), and a
    # maintainer is the actor after pushing a fix to Dependabot's branch.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      # Squash-merge and delete the branch.
      contents: write
      pull-requests: write
      # Start ci.yml on main for the merge commit (the last step).
      actions: write
    steps:
      - name: Fetch metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for CI to pass
        id: gate
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' &&
          !contains(github.event.pull_request.labels.*.name, 'dependabot-merge-ignore')
        env:
          # The head this run was started for, which fetch-metadata read. The
          # checks are read for this commit, and the merge below names it, so
          # nothing pushed while the wait runs can be merged on these results.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job runs as a pull_request workflow, so it is itself one of
          # the checks on the head. Watching every check without excluding it
          # would be waiting on itself: it can only finish after the wait
          # finishes.
          SELF_CHECK: "Auto-merge patch updates"
          # The checks .github/rulesets/main.json requires, as it lists them:
          # each has to be on the head as a check run from that app, and have
          # succeeded. tests/repo/workflow-trust.test.ts fails when this list
          # and the ruleset's differ.
          REQUIRED_CHECKS: |
            [
              { "context": "Lint", "integration_id": 15368 },
              { "context": "Typecheck", "integration_id": 15368 },
              { "context": "Test", "integration_id": 15368 },
              { "context": "Extension", "integration_id": 15368 },
              { "context": "Build", "integration_id": 15368 },
              { "context": "Self-host smoke test", "integration_id": 15368 },
              { "context": "Integration", "integration_id": 15368 },
              { "context": "Dependency review", "integration_id": 15368 },
              { "context": "Secret scan", "integration_id": 15368 },
              { "context": "Workflow and Dockerfile lint", "integration_id": 15368 },
              { "context": "CLI", "integration_id": 15368 },
              { "context": "Scan gate action", "integration_id": 15368 }
            ]
        run: |
          set -euo pipefail

          deadline=$(( $(date +%s) + 85 * 60 ))

          # Each check as {name, app, success, bucket}. Check runs: pass on
          # success, neutral or skipped; pending until completed; anything
          # else completed (failure, cancelled, timed_out, action_required,
          # stale, or a value GitHub adds later) fails. Commit statuses: pass
          # on success, pending on pending, fail on failure or error. A
          # required check is held to `success`, the stricter test, and a
          # status has no app, so it never stands in for one.
          runs_filter='.check_runs[] | {name, app: .app.id, success: (.conclusion == "success"), bucket: (if .status != "completed" then "pending" elif (.conclusion == "success" or .conclusion == "neutral" or .conclusion == "skipped") then "pass" else "fail" end)}'
          statuses_filter='.statuses[] | {name: .context, app: null, success: (.state == "success"), bucket: (if .state == "success" then "pass" elif .state == "pending" then "pending" else "fail" end)}'
          # CI's newest pull_request run on this head as status/conclusion,
          # or "none" before CI has started one.
          ci_filter='[.workflow_runs[] | {id, status, conclusion}] | max_by(.id) | if . == null then "none" else "\(.status)/\(.conclusion)" end'

          while :; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Timed out after 85 minutes waiting for CI to report on ${HEAD_SHA}."
              exit 1
            fi

            # A failed read is not an empty list: with the check runs missing,
            # a commit status alone could look like "everything passed". Wait
            # and read them all again instead. CI's run is read first: once it
            # has finished, every check it makes exists already, so the two
            # reads after it cannot miss one.
            if ! ci_run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${HEAD_SHA}&event=pull_request&per_page=100" --jq "$ci_filter") ||
              ! runs=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?filter=latest&per_page=100" --jq "$runs_filter") ||
              ! statuses=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/status?per_page=100" --jq "$statuses_filter"); then
              echo "Could not read the checks of ${HEAD_SHA}; trying again."
              sleep 30
              continue
            fi
            checks=$(printf '%s\n%s\n' "$runs" "$statuses" | jq -s '.')

            failed=$(echo "$checks" | jq --arg self "$SELF_CHECK" \
              '[.[] | select(.name != $self and .bucket == "fail")] | length')
            pending=$(echo "$checks" | jq --arg self "$SELF_CHECK" \
              '[.[] | select(.name != $self and .bucket == "pending")] | length')
            passed=$(echo "$checks" | jq --arg self "$SELF_CHECK" \
              '[.[] | select(.name != $self and .bucket == "pass")] | length')
            # The required checks with no successful check run of their name
            # from their app on this head, comma-separated.
            missing=$(echo "$checks" | jq -r --argjson required "$REQUIRED_CHECKS" \
              '. as $checks | [$required[] | select(. as $r | any($checks[]; .name == $r.context and .app == $r.integration_id and .success) | not) | .context] | join(", ")')

            if [ "$failed" -gt 0 ]; then
              echo "$checks" | jq -r --arg self "$SELF_CHECK" \
                '.[] | select(.name != $self and .bucket == "fail") | "  \(.name): \(.bucket)"'
              echo "::error::CI did not pass on ${HEAD_SHA}, so this dependabot PR will not be auto-merged. Review it by hand."
              exit 1
            fi
            # A run that ended any other way is CI not passing, whatever the
            # checks read so far say.
            if [ "${ci_run%%/*}" = "completed" ] && [ "$ci_run" != "completed/success" ]; then
              echo "::error::CI's run on ${HEAD_SHA} ended ${ci_run#completed/}, so this dependabot PR will not be auto-merged. Review it by hand."
              exit 1
            fi

            # Nothing pending is not enough on its own: before CI registers
            # its jobs nothing is pending either, and the one check that has
            # passed may be a fast one of another workflow. CI's run has to
            # have finished green, and every check the ruleset requires has to
            # have succeeded.
            if [ "$pending" -eq 0 ] && [ "$ci_run" = "completed/success" ] && [ -z "$missing" ]; then
              echo "CI passed on ${HEAD_SHA}: its run finished green, every check the ruleset requires succeeded, and all $passed check(s) passed."
              break
            fi
            # Finished green with nothing left to report and still short of a
            # required check: it is not coming, so there is no waiting for it.
            if [ "$pending" -eq 0 ] && [ "$ci_run" = "completed/success" ]; then
              echo "::error::CI finished on ${HEAD_SHA} without a successful ${missing}, which .github/rulesets/main.json requires. Review it by hand."
              exit 1
            fi

            echo "waiting on ${HEAD_SHA}: CI ${ci_run}, $pending pending, $passed passed, required still to pass: ${missing:-none}"
            sleep 30
          done

      - name: Merge
        id: merge
        # `steps.gate.outcome` is 'skipped' when the gate did not run (not a
        # patch bump, or the ignore label is set), so this one condition
        # covers both "CI passed" and "this PR is not eligible".
        #
        # --match-head-commit makes GitHub refuse the merge if the branch no
        # longer ends at the commit whose checks the gate read.
        if: steps.gate.outcome == 'success'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --squash --delete-branch --match-head-commit "$HEAD_SHA" "$PR_URL"

      # A push made with GITHUB_TOKEN starts no workflow, so the merge commit
      # would get no CI run, and a tag on it would fail docker-publish's CI
      # gate after its 45-minute wait. workflow_dispatch is the one event this
      # token may start. If another commit lands on main between the merge and
      # this dispatch, CI runs on that newer head, which contains the merge;
      # the merge commit itself then has no run of its own, which is accepted.
      - name: Run CI on the commit it merged
        if: steps.merge.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref main
