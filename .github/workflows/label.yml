name: Auto-label

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

# A later push to the same pull request supersedes the labelling of the
# earlier one, so only the newest run is worth finishing.
concurrency:
  group: label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Nothing at the top level: the job states its own scopes.
permissions: {}

jobs:
  label:
    name: Apply labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Declaring any permission sets every unlisted scope to `none`, so
    # `contents: read` is not redundant here: actions/labeler reads
    # .github/labeler.yml out of the repository through the API, and without
    # contents access that read is what fails.
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Named for what it does. It was "Apply size label", which described a
      # rule that had never worked (see the schema note in labeler.yml).
      - name: Apply path labels
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: false
