name: CI

# NOTE ON ENFORCEMENT: none of the jobs below gate anything on their own.
# A GitHub check only blocks a merge once it is named as a REQUIRED status
# check in a branch ruleset or classic branch protection on `main`, and that
# lives in the repository settings, not in this file. `main` currently has
# no protection and no ruleset, so a red run here is advisory: the merge
# button stays green, direct pushes are unrestricted, and .github/CODEOWNERS
# requests reviewers without requiring their review. The comments below say
# what each step FAILS on, not what it blocks, deliberately: they used to
# claim they blocked merges, which was never true.
#
# To make them real, add a ruleset on `main` requiring the Lint, Typecheck,
# Test, Integration, Extension, Build and Self-host smoke test check names,
# plus a code-owner review, and blocking force pushes.
# .github/rulesets/main.json is that ruleset, listing exactly those seven
# names, ready to import under Settings > Rules > Rulesets > New ruleset >
# Import a ruleset; it lives in the repository so the configuration is
# reviewable here rather than only in the web UI. Two things to know before
# importing it: it ships with an empty `bypass_actors`, so nobody, admins
# included, can push straight to `main` once it is active, and it requires a
# code-owner approval, which on a two-owner CODEOWNERS means the other owner
# has to approve. Add a repository-admin bypass actor if that is not wanted.
#
# .github/workflows/dependabot-auto-merge.yml no longer relies on that: it
# used to call `gh pr merge --auto`, which waits only for branch protection,
# so with none configured a patch bump merged the moment it opened. It now
# waits for the jobs below to report green before merging.

on:
  push:
    # v4/** is the branch naming the 4.0.0 work uses (v4/<topic>, one per
    # piece of work). The Integration job is the only thing that runs real
    # SQL, and those branches are built on machines with no Postgres, so a
    # push to one of them has to run it: each piece is merged to main only
    # after its Integration job is green.
    branches: [main, "v4/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only a pull request's superseded run is worth cancelling. docker-publish
# refuses a commit without a green run here, so a push to main that cancelled
# the run of the commit before it made a tag on that commit fail the publish
# for a run that had simply been stopped.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Nothing at the top level: each job below states the one scope it uses, so a
# job added later starts with no access rather than inheriting a grant.
permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # security: nothing in this job pushes with git, so no token stays
          # behind in .git/config for a later step or package script to read.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Read from .nvmrc, which pins the EXACT patch the Dockerfile builds
          # on, not the floating "22" this used to be. A floating major
          # resolves to whatever 22.x the runner happens to carry that day, so
          # CI could go green on a language or runtime feature the published
          # image does not have. Every setup-node step in this file and in
          # release.yml reads the same file, so there is one number to bump;
          # the "Assert CI Node matches the published image" step in the
          # typecheck job and tests/repo/ci-node-pin.test.ts fail the build if
          # it and the Dockerfile drift apart.
          node-version-file: .nvmrc
          cache: "npm"

      - name: Guard the lockfile
        # Two failures have hit this repo repeatedly and both are one wrong
        # command away, so they are checked mechanically rather than left to
        # a line in CONTRIBUTING.md.
        #
        # 1. A pnpm or yarn install rewrites node_modules in a shape npm
        #    cannot use and drops type packages on the floor.
        # 2. A package-lock.json regenerated on Windows resolves only the
        #    win32 optional binaries and strips every Linux one
        #    (@next/swc-linux-*, @img/sharp-linux-*, @tailwindcss/oxide-linux-*,
        #    lightningcss-linux-*). `npm ci` then succeeds here and the app
        #    dies at next/font with "Cannot find native binding", breaking
        #    CI and the Docker build at once. The musl entries are what the
        #    Alpine images build with, for amd64 and arm64 both, and Turbopack
        #    has no WebAssembly fallback, so a missing one fails the image
        #    build outright. A lockfile that kept the glibc entries and lost
        #    the musl ones passes `npm ci` here and breaks only the image,
        #    and the arm64 one only after the release. The lockfile has to
        #    be repaired by grafting the entries back, not re-resolved, so
        #    catching it at the PR is worth a lot more than catching it at
        #    deploy.
        run: |
          set -euo pipefail
          for f in pnpm-lock.yaml yarn.lock; do
            if [ -e "$f" ]; then
              echo "::error::$f is present. This project is npm-only; delete it and reinstall with npm."
              exit 1
            fi
          done
          missing=""
          for pkg in @next/swc-linux-x64-gnu @next/swc-linux-x64-musl @next/swc-linux-arm64-musl @img/sharp-linux-x64 @tailwindcss/oxide-linux-x64-gnu @tailwindcss/oxide-linux-x64-musl @tailwindcss/oxide-linux-arm64-musl lightningcss-linux-x64-gnu lightningcss-linux-x64-musl lightningcss-linux-arm64-musl; do
            grep -q "\"node_modules/${pkg}\"" package-lock.json || missing="${missing} ${pkg}"
          done
          if [ -n "${missing}" ]; then
            echo "::error::package-lock.json is missing Linux native bindings:${missing}. It was almost certainly regenerated on Windows. Graft the entries back rather than re-resolving."
            exit 1
          fi
          missing_musl=""
          musl=(
            @next/swc-linux-x64-musl @next/swc-linux-arm64-musl
            @img/sharp-linuxmusl-x64 @img/sharp-linuxmusl-arm64
            lightningcss-linux-x64-musl lightningcss-linux-arm64-musl
            @tailwindcss/oxide-linux-x64-musl @tailwindcss/oxide-linux-arm64-musl
          )
          for pkg in "${musl[@]}"; do
            grep -q "\"node_modules/${pkg}\"" package-lock.json || missing_musl="${missing_musl} ${pkg}"
          done
          if [ -n "${missing_musl}" ]; then
            echo "::error::package-lock.json is missing the musl native bindings the Alpine image installs (amd64 and arm64):${missing_musl}. The image build, and the arm64 one only after a release, would fail at next/font. Graft the entries back rather than re-resolving."
            exit 1
          fi
          echo "Lockfile carries the Linux native bindings, glibc and musl, amd64 and arm64."

      - name: Install dependencies
        run: npm ci

      - name: Lint (Oxlint, then ESLint)
        run: npm run lint

      - name: Check Prettier formatting
        # Fails this job on any formatting drift. See the enforcement note
        # at the top of this file for what that does and does not gate.
        run: npm run format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # security: nothing in this job pushes with git, so no token stays
          # behind in .git/config for a later step or package script to read.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Assert CI Node matches the published image
        # The Dockerfile pins an exact patch and the workflows read the same
        # one from .nvmrc. Nothing reconciled the two before, so the moment
        # either side moved, CI was testing a runtime the shipped image was
        # not. This reads the pin out of the Dockerfile's real FROM lines (not
        # the first `node:X-alpine` it can find, which was a comment that had
        # already gone stale) and fails on any difference between every stage,
        # .nvmrc, .node-version and the Node this runner actually has, which
        # is what makes the pins stay one number.
        run: |
          set -euo pipefail
          IMAGE_NODES=""
          while IFS= read -r line; do
            version=$(printf '%s\n' "${line}" | sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)-alpine(@sha256:[0-9a-f]{64})?( .*)?$/\1/p')
            if [ -z "${version}" ]; then
              echo "::error::Dockerfile has a FROM node line that does not pin an exact patch: ${line}"
              exit 1
            fi
            IMAGE_NODES="${IMAGE_NODES}${version}"$'\n'
          done < <(grep -E '^FROM node:' Dockerfile)
          if [ -z "${IMAGE_NODES}" ]; then
            echo "::error::Dockerfile has no FROM node line to read the Node pin from."
            exit 1
          fi
          if [ "$(printf '%s' "${IMAGE_NODES}" | sort -u | wc -l)" != "1" ]; then
            echo "::error::The Dockerfile's stages are built on different Node patches: $(printf '%s' "${IMAGE_NODES}" | sort -u | tr '\n' ' ')"
            exit 1
          fi
          IMAGE_NODE=$(printf '%s' "${IMAGE_NODES}" | sort -u)
          NVMRC_NODE=$(tr -d '[:space:]' < .nvmrc)
          NODE_VERSION_NODE=$(tr -d '[:space:]' < .node-version)
          CI_NODE=$(node -p "process.versions.node")
          echo "Dockerfile pins Node ${IMAGE_NODE}; .nvmrc ${NVMRC_NODE}; .node-version ${NODE_VERSION_NODE}; this runner has ${CI_NODE}"
          for got in "${NVMRC_NODE}" "${NODE_VERSION_NODE}" "${CI_NODE}"; do
            if [ "${got}" != "${IMAGE_NODE}" ]; then
              echo "::error::The Node pins disagree: the published image is built on ${IMAGE_NODE}, .nvmrc says ${NVMRC_NODE}, .node-version says ${NODE_VERSION_NODE}, and this runner has ${CI_NODE}. Bump the Dockerfile's FROM lines, .nvmrc and .node-version together."
              exit 1
            fi
          done

      - name: Generate Next's route types
        # A fresh checkout has no next-env.d.ts (it is not tracked) and no
        # .next/types. next build generates both before it type-checks, so
        # this makes the check below see what the build checks.
        run: npx next typegen

      - name: Run TypeScript typecheck
        # `continue-on-error: true` was removed here: any type error is a bug
        # and fails this job outright. See the enforcement note at the top.
        run: npx tsc --noEmit

      - name: Audit production dependencies
        # Fails this job on a high or critical advisory in a runtime
        # dependency. Only catches advisories that already exist, so it is not
        # a defence against a freshly published malicious release.
        run: npm audit --audit-level=high --omit=dev

      - name: Check generated AI-knowledge files are up to date
        # The AI system prompt is fed committed, generated files (lib/ai/*.md +
        # lib/config/check-stats.generated.ts). The /checks page ids a finding
        # links to are generated too (lib/seo/check-page-ids.generated.ts): a
        # stale mapping would send a finding to the wrong fix guide, and the
        # unit tests only check that its entries are valid. If someone edits
        # the source (changelog data, checks, docs, legal) without
        # regenerating, the AI ships stale knowledge. Regenerate here and fail
        # on any content drift.
        # The compile date line is the only nondeterministic output, so it is
        # ignored -- a real content change still fails the diff.
        run: |
          npm run build:knowledge
          git diff --exit-code --ignore-matching-lines='compiled from' -- lib/ai lib/config/check-stats.generated.ts lib/seo/check-page-ids.generated.ts

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    needs: [lint, typecheck]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # security: nothing in this job pushes with git, so no token stays
          # behind in .git/config for a later step or package script to read.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Runs the whole vitest suite WITH coverage, so the per-file thresholds
      # in vitest.config.ts are actually enforced. This used to be `npm run
      # test` (no coverage), which meant the threshold map was checked
      # nowhere: the only command that read it was `npm run test:coverage`,
      # nothing ran it, and it had drifted red on files nobody had touched,
      # so anyone who did run it learned to ignore the output.
      # tests/README.md tells contributors a coverage regression fails the
      # build; this is the job that makes that true.
      - name: Run unit tests with coverage
        run: npm run test:coverage

      # The CLI (cli/) is a standalone, dependency-free Node package excluded
      # from the app's tsc/eslint/vitest, so its node:test suite runs here.
      # `npm test` rather than a bare `node --test` so the package's own
      # script (which turns on --experimental-test-coverage) is what runs:
      # the CLI's tested fraction used to be simply unknown.
      - name: Run CLI tests
        run: npm test
        working-directory: cli

  # The CLI claims every Node from the engines floor up and ships for three
  # operating systems, and until this job it was only ever run on Linux, on
  # the one Node the image carries. Each leg runs the suite, then installs the
  # tarball `npm pack` produces into an empty project and runs the binary the
  # way a user does, so a file missing from `files` or a Windows shim that
  # cannot start Node fails here and not on a user's machine. The suite's
  # server is a stand-in on 127.0.0.1, so nothing leaves the runner.
  #
  # The `pinned` leg reads .nvmrc (an empty `version` falls back to it), the
  # `floor` leg is the lowest Node cli/package.json promises, and `lts` is
  # whatever the newest long-term-support line is today, which changes about
  # once a year and is the point of it. tests/repo/ci-node-pin.test.ts lets
  # this job, and only this one, name a Node version, and tests/repo/
  # cli-package.test.ts holds `floor` equal to the package's engines.
  cli-matrix:
    name: CLI on ${{ matrix.os }}, Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    # The suite took 146 s on a loaded Windows machine.
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [pinned, floor, lts]
        include:
          - node: pinned
            version: ""
          - node: floor
            version: "22.12.0"
          - node: lts
            version: "lts/*"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          node-version: ${{ matrix.version }}
          # The CLI has no dependencies and no lockfile to key a cache on.
          package-manager-cache: false

      - name: Run the CLI tests
        run: npm test
        working-directory: cli

      - name: Install the packed CLI and run it
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./cli/package.json').version")

          cd cli
          # The tarball holds exactly what `files` lists, plus package.json.
          npm pack --dry-run --json --ignore-scripts | node -e "
            const fs = require('node:fs');
            const packed = JSON.parse(fs.readFileSync(0, 'utf8'))[0].files.map((f) => f.path).sort();
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const wanted = [...pkg.files, 'package.json'].sort();
            if (JSON.stringify(packed) !== JSON.stringify(wanted)) {
              console.log('::error::npm pack lists ' + packed.join(', ') + ' but package.json files plus package.json is ' + wanted.join(', '));
              process.exit(1);
            }
            console.log('the tarball holds ' + packed.join(', '));
          "

          tarball=$(npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP" | node -p "JSON.parse(require('node:fs').readFileSync(0, 'utf8'))[0].filename")
          consumer="$RUNNER_TEMP/vr-cli-consumer"
          rm -rf "$consumer"
          mkdir -p "$consumer"
          cd "$consumer"
          npm init -y > /dev/null
          npm install --ignore-scripts --no-audit --no-fund "../$tarball"

          # Through npx, so the Windows .cmd shim is what starts Node.
          got=$(npx --no-install vulnradar --version | tr -d '[:cntrl:]')
          if [ "$got" != "$version" ]; then
            echo "::error::The installed CLI printed '$got' for --version, cli/package.json says '$version'."
            exit 1
          fi
          npx --no-install vulnradar --help > /dev/null
          echo "The installed CLI ${got} starts and prints its help."

  # The one check name the ruleset can require. Matrix leg names change
  # whenever the matrix does; this one does not.
  cli:
    name: CLI
    needs: [cli-matrix]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Every leg passed
        env:
          NEEDS_RESULT: ${{ needs.cli-matrix.result }}
        run: |
          if [ "$NEEDS_RESULT" != "success" ]; then
            echo "::error::The CLI did not pass on every platform and Node version: ${NEEDS_RESULT}."
            exit 1
          fi

  # The only job that executes real SQL. tests/integration/ is excluded from
  # the root vitest config so `npm test` stays green without a database, which
  # means this job is the ONLY thing that runs it: nothing else in the repo
  # proves that a query parses, that the columns it names exist, or that a
  # constraint behaves the way the code assumes. See tests/README.md.
  #
  # Deliberately standalone rather than part of the Test job. It needs a
  # services: container the other jobs do not, it takes a different amount of
  # time, and a database that fails to come up must not be able to take the
  # unit suite down with it. ref: AUDIT-013#cov-16
  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    services:
      postgres:
        # Same image as the Self-host smoke test job and docker-compose.yml,
        # so all three prove things about one PostgreSQL version.
        #
        # This said 16.4 while both compose files had moved to 16.15, so the
        # claim above was false and the tests proved things about a version no
        # self-hoster was running. Dependabot cannot see inside a workflow's
        # `services:` block, so the reference is repeated, digest and all, in
        # the postgres stage of .github/tools/Dockerfile, which it does watch.
        # tests/repo/workflow-hardening.test.ts fails until this line, that
        # stage and docker-compose.yml's tag agree, so a bump on either side
        # is impossible to miss.
        image: postgres:16.15-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
        env:
          POSTGRES_USER: vulnradar
          POSTGRES_PASSWORD: ci_integration_password
          POSTGRES_DB: vulnradar_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # security: nothing in this job pushes with git, so no token stays
          # behind in .git/config for a later step or package script to read.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # DATABASE_URL is deliberately NOT set here. The bootstrap refuses to run
      # when the two point at the same database, since it drops and rebuilds
      # the public schema; leaving it unset makes that impossible to get wrong.
      # The remaining env (API_KEY_ENCRYPTION_KEY, NEXT_PUBLIC_APP_URL) is
      # defaulted in tests/integration/_setup.ts so a local run and this one
      # are configured identically.
      - name: Run the integration suite against a real PostgreSQL
        run: >-
          npx vitest run --config tests/integration/vitest.config.ts
          --reporter=default --reporter=json
          --outputFile.json="$RUNNER_TEMP/integration-results.json"
        env:
          INTEGRATION_DATABASE_URL: postgresql://vulnradar:ci_integration_password@127.0.0.1:5432/vulnradar_integration

      # The suite skips itself cleanly when INTEGRATION_DATABASE_URL is absent,
      # which is right for a developer and wrong for CI: a job that skipped
      # every test exits 0 and looks identical to one that passed. Read the
      # counts back and fail on a run that proved nothing.
      - name: Assert the suite actually ran
        run: |
          node -e "
            const r = require(process.env.RUNNER_TEMP + '/integration-results.json');
            const passed = r.numPassedTests ?? 0;
            const skipped = r.numPendingTests ?? 0;
            console.log('passed=' + passed + ' skipped=' + skipped);
            if (skipped > 0 || passed === 0) {
              console.log('::error::the integration suite did not really run (' + passed + ' passed, ' + skipped + ' skipped). INTEGRATION_DATABASE_URL is unset, or the database was unreachable.');
              process.exit(1);
            }
          "

      # The integration suite proves OUR reader can apply the dump we write.
      # It cannot prove the claim that actually matters to an operator, which
      # is that any PostgreSQL can import it: a Pterodactyl or Pelican install
      # runs from source with no pg_dump, so this file is their only backup,
      # and the moment they need it they may well be reaching for psql or a
      # managed provider's import rather than for our restore command.
      #
      # So: generate a dump with the pure-JavaScript writer, hand it to psql
      # with nothing of ours involved, and require the schema and the rows to
      # come back. ON_ERROR_STOP turns any single bad statement into a failure
      # instead of a partially applied database that exits 0.
      - name: A real psql must be able to import the JavaScript dump
        env:
          INTEGRATION_DATABASE_URL: postgresql://vulnradar:ci_integration_password@127.0.0.1:5432/vulnradar_integration
          PGPASSWORD: ci_integration_password
        run: |
          set -euo pipefail

          # A separate database, so importing cannot touch the one the suite
          # just used and a failure here is unambiguous.
          psql -h 127.0.0.1 -U vulnradar -d postgres \
            -v ON_ERROR_STOP=1 -c 'DROP DATABASE IF EXISTS vr_psql_import;'
          psql -h 127.0.0.1 -U vulnradar -d postgres \
            -v ON_ERROR_STOP=1 -c 'CREATE DATABASE vr_psql_import;'

          BACKUP_FORCE_JS=1 DATABASE_URL="$INTEGRATION_DATABASE_URL" \
            BACKUP_DIR=ci-psql-check BACKUP_RETENTION_DAYS=0 \
            npm run db:backup

          DUMP=$(ls -t ci-psql-check/*.sql.gz | head -1)
          echo "importing $DUMP"
          gunzip -c "$DUMP" > ci-psql-check/dump.sql

          # No VulnRadar code in this line. If it fails, the file is not
          # importable by a stock PostgreSQL client and the feature's central
          # promise is false.
          psql -h 127.0.0.1 -U vulnradar -d vr_psql_import \
            -v ON_ERROR_STOP=1 --single-transaction -f ci-psql-check/dump.sql

          # An import that applied zero tables would still exit 0 above.
          TABLES=$(psql -h 127.0.0.1 -U vulnradar -d vr_psql_import -tAc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'")
          echo "imported tables: $TABLES"
          if [ "$TABLES" -lt 40 ]; then
            echo "::error::psql imported only $TABLES tables; the dump is not a usable backup."
            exit 1
          fi

  extension:
    name: Extension
    runs-on: ubuntu-latest
    # 10 before web-ext was installed and run.
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # security: nothing in this job pushes with git, so no token stays
          # behind in .git/config for a later step or package script to read.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: extension/package-lock.json

      # The browser extension is a separate package (extension/) with its own
      # deps, tsconfig, and build. It was previously not covered by CI at all,
      # so a change that broke its typecheck, formatting, or build could land
      # unnoticed. This job type-checks it, enforces formatting, and builds
      # both the Chrome and Firefox targets.
      - name: Guard the extension lockfile
        # The same Windows trap the root lockfile is guarded against, which the
        # extension had no equivalent check for. Its dev tree is now native-
        # heavy - vite 8 pulls in rolldown and lightningcss, and sharp builds
        # the icons - so a lockfile regenerated on Windows resolves only the
        # win32 binaries. `npm ci` below still succeeds; `npm run build` then
        # fails inside rolldown with a native-binding error that says nothing
        # about lockfiles. CI goes red either way, so nothing ships broken -
        # this just turns an afternoon of confusion into one line.
        run: |
          set -euo pipefail
          missing=""
          for pkg in @rolldown/binding-linux-x64-gnu lightningcss-linux-x64-gnu @img/sharp-linux-x64; do
            grep -q "\"node_modules/${pkg}\"" package-lock.json || missing="${missing} ${pkg}"
          done
          if [ -n "${missing}" ]; then
            echo "::error::extension/package-lock.json is missing Linux native bindings:${missing}. It was almost certainly regenerated on Windows. Graft the entries back rather than re-resolving."
            exit 1
          fi
          echo "Extension lockfile carries the Linux native bindings."
        working-directory: extension

      - name: Install extension dependencies
        run: npm ci
        working-directory: extension

      - name: Audit extension dependencies
        # No `--omit=dev` here, unlike the root audit in the typecheck job.
        # The extension has 2 runtime dependencies and 191 dev ones, and the
        # dev tree (vite, rollup, esbuild, sharp, archiver) is what emits
        # content.js, the script injected into every page the user visits.
        # A compromised build dependency writes straight into a
        # browser-privileged artifact shipped through the Chrome Web Store
        # and AMO, so for this package the dev tree IS the shipped tree.
        run: npm audit --audit-level=high
        working-directory: extension

      - name: Typecheck extension
        run: npm run typecheck
        working-directory: extension

      - name: Check extension formatting
        run: npm run format:check
        working-directory: extension

      - name: Build and package the extension
        # `npm run build`, not build:chrome && build:firefox. Those two skip
        # scripts/package.mjs and package-source.mjs, so the only step CI never
        # ran was the one that produces the artifact actually uploaded to the
        # Chrome Web Store and AMO -- and it was broken: archiver 8 dropped its
        # default export, so the documented build command threw at module load
        # while CI stayed green.
        run: npm run build
        working-directory: extension

      - name: The packaged zips must exist and carry this version
        # A build that emits no zip, or one labelled with a stale version, is
        # a release that fails add-on review rather than a red CI run. Both
        # halves matter: build:chrome followed by package would zip the other
        # target's older dist under today's version number.
        run: |
          set -euo pipefail
          VERSION=$(node -p 'require("./package.json").version')
          for target in chrome firefox; do
            zip="vulnradar-${target}-v${VERSION}.zip"
            if [ ! -f "$zip" ]; then
              echo "::error::missing $zip"
              exit 1
            fi
            manifest=$(node -p "require('./dist-${target}/manifest.json').version")
            if [ "$manifest" != "$VERSION" ]; then
              echo "::error::dist-${target} manifest is $manifest, package.json is $VERSION"
              exit 1
            fi
            echo "ok: $zip (manifest $manifest)"
          done
        working-directory: extension

      - name: Check what the built extension asks for
        # The permissions, the CSP, the icons, the two background shapes and
        # the size of each store zip, read from what the build above emitted
        # rather than from the templates. Any permission the built manifests
        # request that extension/manifest/permissions.allowlist.json does not
        # record fails here, and that file is CODEOWNERS-reviewed, so a new
        # permission cannot arrive as a side effect of a feature. It also
        # fails on a VulnRadar API key anywhere in either dist.
        run: node scripts/verify-dist.mjs
        working-directory: extension

      - name: Lint the Firefox package the way AMO does
        # web-ext is AMO's own linter. It runs from .github/tools/web-ext, a
        # package of its own, so its tree never joins the one that emits
        # content.js, and with --ignore-scripts because nothing in it needs to
        # run code to install. Its exit code is not read: the report decides.
        # Errors fail, warnings and notices go to the job summary, and a name
        # in lint-exceptions.json that no longer matches an error fails too.
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install web-ext lint \
            --source-dir "$GITHUB_WORKSPACE/extension/dist-firefox" \
            --output json > "$RUNNER_TEMP/web-ext-lint.json" || true
          node "$GITHUB_WORKSPACE/scripts/ci/web-ext-lint-report.mjs" \
            "$RUNNER_TEMP/web-ext-lint.json" lint-exceptions.json
        working-directory: .github/tools/web-ext

      - name: Upload the store packages for review
        # The exact zips this run built, for whoever reviews the pull request
        # or submits to the stores: the Chrome and Firefox packages and the
        # source archive AMO asks for.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-packages
          path: extension/vulnradar-*.zip
          retention-days: 7
          if-no-files-found: error

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    needs: [lint, typecheck]

    # security: the server secrets are unique sentinels rather than
    # "placeholder", so the step after the build can search the client bundle
    # for each one: a server value that reached .next/static is shipped to
    # every browser. Each is a value the build accepts. The variables that
    # are empty stay empty, since setting one can switch a feature on at
    # build time. The encryption key is a CI value .gitleaks.toml allowlists.
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: "postgresql://placeholder:vrci-sentinel-db-password@localhost:5432/placeholder"
      DATABASE_SSL: "false"
      STRIPE_SECRET_KEY: "vrci-sentinel-stripe-secret"
      STRIPE_WEBHOOK_SECRET: "vrci-sentinel-stripe-webhook"
      STRIPE_PUBLISHABLE_KEY: "placeholder"
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "placeholder"
      API_KEY_ENCRYPTION_KEY: "5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ""
      TURNSTILE_SECRET_KEY: ""
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: ""
      DISCORD_CLIENT_ID: ""
      DISCORD_CLIENT_SECRET: ""
      DISCORD_BOT_TOKEN: ""
      DISCORD_GUILD_ID: ""
      CONTACT_EMAIL: ""
      SUPPORT_EMAIL: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # security: nothing in this job pushes with git, so no token stays
          # behind in .git/config for a later step or package script to read.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build

      - name: Assert middleware still compiles for the Edge runtime and covers the API
        # The bundler compiles the runtime and the matchers; the script says
        # what it checks and why.
        run: node scripts/ci/next16-build-checks.mjs .next

      # grep exits 1 for "searched and found nothing" and 2 for "could not
      # search", so a moved output directory fails here instead of passing.
      - name: No server secret reached the client bundle
        run: |
          set -euo pipefail
          if [ ! -d .next/static ]; then
            echo "::error::.next/static does not exist, so the client bundle could not be searched."
            exit 1
          fi
          leaked=false
          for sentinel in \
            "$STRIPE_SECRET_KEY" \
            "$STRIPE_WEBHOOK_SECRET" \
            vrci-sentinel-db-password \
            "$API_KEY_ENCRYPTION_KEY"; do
            set +e
            hits=$(grep -rIl -e "$sentinel" .next/static)
            rc=$?
            set -e
            case "$rc" in
              0)
                echo "::error::A server secret's sentinel ($sentinel) is in the client bundle:"
                echo "$hits"
                leaked=true
                ;;
              1) ;;
              *)
                echo "::error::grep could not search .next/static (exit $rc)."
                exit 1
                ;;
            esac
          done
          if [ "$leaked" = "true" ]; then exit 1; fi
          echo "No server secret's sentinel is in .next/static."

  # Builds the real image and boots it against an EMPTY Postgres, which is
  # exactly what a self-hoster does on first run. Nothing in CI did this
  # before, which is how three separate self-host-breaking defects shipped
  # at once in 3.7.x: an image tag that was never published, a boot path
  # that exited before creating any table on a blank database, and a
  # runtime stage missing scripts/ so the documented recovery command was
  # not in the container. See audits/AUDIT-014 (ci-01, host-01, host-02).
  selfhost:
    name: Self-host smoke test
    runs-on: ubuntu-latest
    # 30 before the cross-site attack suite joined the self-scan against the
    # booted container.
    timeout-minutes: 40
    permissions:
      contents: read

    services:
      postgres:
        # The same reference as the Integration job above.
        image: postgres:16.15-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
        env:
          POSTGRES_USER: vulnradar
          POSTGRES_PASSWORD: ci_smoke_test_password
          POSTGRES_DB: vulnradar
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # security: nothing in this job pushes with git, so no token stays
          # behind in .git/config for a later step or package script to read.
          persist-credentials: false

      - name: Validate the documented compose configurations
        # This job only boots the default stack, so a change to
        # docker-compose.yml that broke the managed-database overlay, or a typo
        # in the overlay itself, would reach operators first. `config` parses,
        # interpolates and merges without pulling or starting anything. Both
        # setups are configured the way the docs tell operators to: through
        # .env.
        run: |
          set -euo pipefail
          trap 'rm -f .env' EXIT
          docker compose version
          cat > .env <<'ENV'
          POSTGRES_PASSWORD=ci_compose_config_password
          API_KEY_ENCRYPTION_KEY=00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
          ENV

          services=$(docker compose config --services | sort | tr '\n' ' ')
          echo "bundled database: ${services}"
          test "${services}" = "app postgres " || { echo "expected app and postgres"; exit 1; }
          docker compose config --format json | jq -e \
            '.services.app.environment.DATABASE_URL | startswith("postgresql://vulnradar:ci_compose_config_password@postgres:5432/")'

          cat >> .env <<'ENV'
          DATABASE_URL=postgresql://managed:ci_secret@db.example.com:5432/vulnradar
          COMPOSE_FILE=docker-compose.yml:docker-compose.managed-db.yml
          ENV

          services=$(docker compose config --services | sort | tr '\n' ' ')
          echo "managed database: ${services}"
          test "${services}" = "app " || { echo "expected only app: the bundled postgres must stay behind its profile"; exit 1; }
          cfg=$(docker compose config --format json)
          echo "${cfg}" | jq -e '.services.app.environment.DATABASE_URL == "postgresql://managed:ci_secret@db.example.com:5432/vulnradar"'
          echo "${cfg}" | jq -e '.services.app.environment.DATABASE_SSL == "true"'
          echo "${cfg}" | jq -e '(.services.app.depends_on // {}) | length == 0'

      - name: Build the production image
        # build.invalid is a sentinel: it can never resolve, and the step
        # after next fails if it reached the code that writes password-reset
        # links. The published image is built with this value empty, which
        # would pass that check whether or not the origin was inlined.
        run: docker build --build-arg NEXT_PUBLIC_APP_URL=https://build.invalid -t vulnradar:ci .

      - name: Assert the runtime image carries what the docs tell operators to run
        # A published image that cannot run its own documented recovery
        # command is the defect this step exists to catch.
        run: |
          set -euo pipefail
          for path in server.mjs \
                      scripts/migrate/migrate.mjs \
                      scripts/create-fresh-db/create-fresh-db.mjs \
                      scripts/backup-db.mjs \
                      lib/database/schema/index.mjs \
                      lib/ai/docs-knowledge.md; do
            echo "checking for $path"
            docker run --rm --entrypoint sh vulnradar:ci -c "test -f '$path'" \
              || { echo "MISSING from runtime image: $path"; exit 1; }
          done

      - name: Assert the build's origin did not reach server code
        # The forgot-password handler writes reset links, so its own code
        # must read the origin at run time. webpack put that code in the
        # route's route.js; Turbopack makes route.js a loader and puts the
        # code in shared chunks. Both places are searched, the handler is
        # found by a string only it contains, and finding no handler fails
        # the step instead of passing it. lib/config/client-constants.ts
        # still inlines the origin into APP_URL by design, which is why the
        # whole tree is not searched. grep exits 1 for searched and found
        # nothing and 2 for could not search, so only a 1 passes: a holder
        # path that splits on whitespace or cannot be read fails the step.
        run: |
          docker run --rm --entrypoint sh vulnradar:ci -c '
            set -eu
            set -f
            route=.next/server/app/api/v3/auth/forgot-password
            test -s "$route/route.js" || { echo "no route entry at $route/route.js"; exit 1; }
            holders=$(find "$route" .next/server/chunks -type f -name "*.js" -exec grep -l "a reset link has been generated" {} + || true)
            test -n "$holders" || { echo "no file holds the forgot-password handler"; exit 1; }
            echo "handler code in: $holders"
            rc=0
            grep -l build.invalid $holders || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "the build origin is inlined into the forgot-password handler"
              exit 1
            fi
            if [ "$rc" -ne 1 ]; then
              echo "could not search the handler files, grep exited $rc"
              exit 1
            fi
          '

      - name: Assert the server cannot rewrite its own code
        # security: these run as the image's default user, the uid the server
        # runs as. Code that uid owns turns any write primitive in the app
        # into code execution for the life of the container.
        run: |
          docker run --rm --entrypoint sh vulnradar:ci -c '
            set -e
            test ! -w node_modules/next/package.json
            test ! -w package.json
            test ! -w server.mjs
            test ! -w lib
            test ! -w scripts
            test ! -w .next/BUILD_ID
            test -w .next/cache
            test -w backups
            test -w data/avatars
          '

      - name: Assert the image has no cosign binary
        # Only the self-updater would run one, and the image disables the
        # updater, so a binary here is unreviewed weight and nothing else.
        run: |
          docker run --rm --entrypoint sh vulnradar:ci -c '
            if command -v cosign; then
              echo "cosign is on PATH in the image"
              exit 1
            fi
          '

      - name: Boot the documented compose quick start
        # The steps docker-compose.yml's header gives a self-hoster: copy
        # .env.example, set the two variables compose refuses to start
        # without, `docker compose up -d`.
        # Both emails stay empty, which is how the quick start reaches the app
        # and what crash-looped it when validation rejected an empty string.
        # Runs the image this job just built, tagged as the one compose names,
        # so a commit that has never been published can still be tested.
        run: |
          set -euo pipefail
          cp .env.example .env
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then docker compose logs --no-color --tail 200 app || true; fi
            docker compose down -v --remove-orphans || true
            rm -f .env
            exit "$status"
          }
          trap cleanup EXIT
          sed -i -E \
            -e 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci_compose_quickstart_password/' \
            -e 's/^API_KEY_ENCRYPTION_KEY=.*/API_KEY_ENCRYPTION_KEY=00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff/' \
            .env
          printf 'CONTACT_EMAIL=\nSUPPORT_EMAIL=\n' >> .env

          IMAGE=$(docker compose config --format json | jq -r '.services.app.image')
          docker tag vulnradar:ci "${IMAGE}"
          docker compose up -d --no-build

          for i in $(seq 1 60); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:3000/api/v3/health 2>/dev/null || true)
            if [ "$code" = "200" ]; then
              echo "compose quick start healthy after $((i * 5))s"
              exit 0
            fi
            sleep 5
          done
          echo "the compose quick start never answered 200 on /api/v3/health"
          exit 1

      - name: Boot against an empty database and wait for health
        # APP_URL is the origin this container serves: the build above baked
        # in build.invalid, and server code must not be reading that. It is
        # the only URL set, which is also the plain `docker run` the docs give.
        run: |
          set -euo pipefail
          docker run -d --name vr-smoke --network host \
            -e NODE_ENV=production \
            -e DATABASE_URL='postgresql://vulnradar:ci_smoke_test_password@localhost:5432/vulnradar' \
            -e DATABASE_SSL=false \
            -e APP_URL=http://localhost:3000 \
            -e API_KEY_ENCRYPTION_KEY=00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff \
            vulnradar:ci

          # A 200 from the health endpoint, not merely a non-error: curl -f
          # treats a 301 as success, and the app's plain-HTTP redirect answered
          # this probe with one, so the job reported "healthy" on a redirect
          # while the image's own HEALTHCHECK (wget, which follows it into an
          # https port nothing serves) was failing on every install.
          for i in $(seq 1 60); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:3000/api/v3/health 2>/dev/null || true)
            if [ "$code" = "200" ]; then
              echo "healthy after ${i}0s"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' vr-smoke)" != "true" ]; then
              echo "container exited before becoming healthy:"
              docker logs vr-smoke
              exit 1
            fi
            sleep 10
          done

          echo "never became healthy within 10 minutes:"
          docker logs vr-smoke
          exit 1

      - name: Assert the schema was actually created
        run: |
          set -euo pipefail
          count=$(docker exec "$(docker ps -qf name=postgres)" \
            psql -U vulnradar -d vulnradar -tAc \
            "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public'" \
            2>/dev/null || echo 0)
          echo "tables created: $count"
          test "$count" -gt 40 || { echo "expected the full schema, got $count tables"; exit 1; }

      - name: Assert the image's own HEALTHCHECK passes
        run: |
          set -euo pipefail
          docker exec vr-smoke wget --no-verbose --tries=1 --spider http://localhost:3000/api/v3/health

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Probe the running image for script nonces, escaped API writes and route types
        # What Next takes part in at run time that no unit test sees; the
        # script says what it checks and why.
        run: node scripts/ci/next16-runtime-probes.mjs http://localhost:3000

      # VulnRadar must pass VulnRadar. Every route the sitemap publishes is
      # fetched from the container just booted and run through the same engine
      # a scan uses. A finding fails the build unless tests/selfscan lists it
      # as accepted, with the reason it is not a defect. The container is
      # reached over plain HTTP but deployed behind a TLS terminator, so pages
      # are judged at their https URL (see the suite's header).
      - name: Self-scan every published route
        env:
          VULNRADAR_SELF_SCAN_URL: http://localhost:3000
          VULNRADAR_SELF_SCAN_BEHIND_TLS: "1"
        run: >-
          npx vitest run tests/selfscan
          --reporter=default --reporter=json
          --outputFile.json="$RUNNER_TEMP/selfscan-results.json"

      # The suite skips itself when VULNRADAR_SELF_SCAN_URL is unset, so a
      # renamed variable on either side turned this step into a green run
      # that scanned nothing. The same check the Integration job makes.
      - name: Assert the self-scan actually ran
        run: |
          node -e "
            const r = require(process.env.RUNNER_TEMP + '/selfscan-results.json');
            const passed = r.numPassedTests ?? 0;
            const skipped = r.numPendingTests ?? 0;
            console.log('passed=' + passed + ' skipped=' + skipped);
            if (skipped > 0 || passed === 0) {
              console.log('::error::the self-scan did not really run (' + passed + ' passed, ' + skipped + ' skipped). VULNRADAR_SELF_SCAN_URL did not reach it.');
              process.exit(1);
            }
          "

      # Black-box: every state-changing route of the container just booted
      # refuses a request from another site's Origin, a cross-site fetch
      # with no Origin, and the session cookie alone, while a Bearer API
      # call and a same-origin request get past the check. Only
      # localhost:3000 is contacted. See tests/attack/cross-site.test.ts.
      - name: Attack the booted app (cross-site writes)
        env:
          VULNRADAR_ATTACK_URL: http://localhost:3000
        run: >-
          npx vitest run tests/attack
          --reporter=default --reporter=json
          --outputFile.json="$RUNNER_TEMP/attack-results.json"

      - name: Assert the attack suite actually ran
        run: |
          node -e "
            const r = require(process.env.RUNNER_TEMP + '/attack-results.json');
            const passed = r.numPassedTests ?? 0;
            const skipped = r.numPendingTests ?? 0;
            console.log('passed=' + passed + ' skipped=' + skipped);
            if (skipped > 0 || passed === 0) {
              console.log('::error::the attack suite did not really run (' + passed + ' passed, ' + skipped + ' skipped). VULNRADAR_ATTACK_URL did not reach it.');
              process.exit(1);
            }
          "

      # Every page the sitemap lists, fetched from the container just booted:
      # a 200, one title in <head>, a description, a canonical equal to the
      # sitemap URL, og tags with a working image, JSON-LD, one h1, no noindex,
      # and the same head for Googlebot as for a browser. Then every same-origin
      # link they carry. The script refuses any URL that is not
      # localhost:3000. Known problems are named, with a reason, in
      # .github/site-checks/baseline.json, which can only shrink: a finding
      # that is not in it fails, and an entry that no longer occurs fails too.
      - name: Check every sitemap page (SEO and links)
        run: >-
          node scripts/ci/site-checks/check-site.mjs
          --base http://localhost:3000
          --baseline .github/site-checks/baseline.json

      - name: Stop the smoke container and assert a clean shutdown
        # SIGTERM runs lib/database/boot/graceful-shutdown.ts, which stops the
        # workers through member calls on dynamic imports
        # (lib/database/boot/workers.ts, stopBackgroundWorkers). Turbopack
        # mangles export names in production builds since 16.4, and nothing
        # else in CI runs this path. A failed stop is caught and logged, so
        # the log is searched for it. The handler always ends in exit(0), so
        # any other code means the process died or was killed at the
        # deadline. -t 60 covers the 30s drain budget plus the 5s pool budget.
        run: |
          set -euo pipefail
          docker stop -t 60 vr-smoke
          code=$(docker inspect -f '{{.State.ExitCode}}' vr-smoke)
          log="$RUNNER_TEMP/vr-smoke.log"
          docker logs vr-smoke > "$log" 2>&1
          rc=0
          grep -E 'Shutdown: stopping workers failed|Failed to stop a background worker|Error closing database pool' "$log" || rc=$?
          if [ "$rc" -eq 0 ]; then echo "the shutdown logged a failure"; exit 1; fi
          if [ "$rc" -ne 1 ]; then echo "could not search the container log"; exit 1; fi
          [ "$code" = "0" ] || { echo "exit code $code"; tail -n 50 "$log"; exit 1; }
          echo "clean shutdown, exit code 0"

      - name: Container logs on failure
        if: failure()
        run: docker logs vr-smoke || true

  # Report-only, and not in the ruleset: every pull request that touches the
  # CLI would warn until the CLI is bumped. It names the package, so the bump
  # happens in the pull request that makes it necessary rather than when the
  # release build fails on it.
  package-versions:
    name: Package versions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every tag and both sides of the pull request: the previous release
          # is found with git describe, and the diff is the pull request's own.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # Nothing is installed: the script has no dependencies.
          package-manager-cache: false

      - name: Report packages changed without a version bump
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci/package-versions.mjs --mode pr --ref "$HEAD_SHA" --base "$BASE_SHA"

  # The scan-gate composite action is what users add to their own CI, and it
  # only ever ran in this repository as a script extracted by the repo tests.
  # This runs it as an action, `uses: ./.github/actions/scan-gate`, on the
  # three runner images people use, against a stand-in API on 127.0.0.1
  # (tests/fixtures/scan-gate/mock-api.mjs), so nothing leaves the runner.
  # The key is a fixed string the stand-in checks; it is not a key.
  action-matrix:
    name: Scan gate action on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # Nothing is installed: the stand-in API is node:http only.
          package-manager-cache: false

      - name: Start the stand-in API on loopback
        shell: bash
        run: |
          set -euo pipefail
          port_file="$RUNNER_TEMP/scan-gate-mock-port"
          log="$RUNNER_TEMP/scan-gate-mock.log"
          rm -f "$port_file"
          nohup node tests/fixtures/scan-gate/mock-api.mjs --port-file "$port_file" > "$log" 2>&1 &
          for _ in $(seq 1 100); do
            if [ -s "$port_file" ]; then break; fi
            sleep 0.2
          done
          if [ ! -s "$port_file" ]; then
            echo "::error::The stand-in API did not start within 20 seconds."
            cat "$log" || true
            exit 1
          fi
          echo "VR_MOCK_BASE=http://127.0.0.1:$(cat "$port_file")/api/v3" >> "$GITHUB_ENV"

      - name: Clean scan passes
        id: clean
        uses: ./.github/actions/scan-gate
        with:
          url: https://clean.scan-gate.test/
          api-key: vr-ci-not-a-key
          api-base-url: ${{ env.VR_MOCK_BASE }}
          poll-interval-seconds: "1"
          sarif-file: ""

      - name: Its outputs carry the counts
        shell: bash
        env:
          CRITICAL: ${{ steps.clean.outputs.critical }}
          HIGH: ${{ steps.clean.outputs.high }}
          MEDIUM: ${{ steps.clean.outputs.medium }}
          TOTAL: ${{ steps.clean.outputs.total }}
          SCAN_ID: ${{ steps.clean.outputs.scan-id }}
        run: |
          set -euo pipefail
          for pair in "critical:$CRITICAL" "high:$HIGH" "medium:$MEDIUM" "total:$TOTAL"; do
            if [ "${pair#*:}" != "0" ]; then
              echo "::error::The clean scan's ${pair%%:*} output is '${pair#*:}', expected 0."
              exit 1
            fi
          done
          if [ -z "$SCAN_ID" ]; then
            echo "::error::The clean scan set no scan-id output."
            exit 1
          fi
          echo "The clean scan passed with every count 0 (scan ${SCAN_ID})."

      - name: Failing scan
        id: failing
        continue-on-error: true
        uses: ./.github/actions/scan-gate
        with:
          url: https://failing.scan-gate.test/
          api-key: vr-ci-not-a-key
          api-base-url: ${{ env.VR_MOCK_BASE }}
          poll-interval-seconds: "1"
          sarif-file: ""

      # The outcome alone would also be "failure" for a gate that could not
      # reach the API at all; the counts say it judged the findings.
      - name: The failing scan failed the gate
        shell: bash
        env:
          OUTCOME: ${{ steps.failing.outcome }}
          CRITICAL: ${{ steps.failing.outputs.critical }}
          HIGH: ${{ steps.failing.outputs.high }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::The failing scan's outcome is '$OUTCOME', expected failure."
            exit 1
          fi
          if [ "$CRITICAL" != "2" ] || [ "$HIGH" != "1" ]; then
            echo "::error::The failing scan reported critical=$CRITICAL high=$HIGH, expected 2 and 1."
            exit 1
          fi
          echo "The failing scan failed the gate on 2 critical and 1 high."

      - name: Stand-in API log on failure
        if: failure()
        shell: bash
        run: cat "$RUNNER_TEMP/scan-gate-mock.log" || true

  # The one check name the ruleset can require. Matrix leg names change
  # whenever the matrix does; this one does not.
  action:
    name: Scan gate action
    needs: [action-matrix]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Every leg passed
        env:
          NEEDS_RESULT: ${{ needs.action-matrix.result }}
        run: |
          if [ "$NEEDS_RESULT" != "success" ]; then
            echo "::error::The scan gate action did not pass on every runner: ${NEEDS_RESULT}."
            exit 1
          fi

  # Only the dependencies a pull request adds or changes, against GitHub's
  # advisory database, at the bar both npm audit steps use. Runtime and
  # development scopes both: the extension's dev tree is the tree that emits
  # content.js, and the root dev tree runs `next build`. No comment on the
  # pull request, so it needs no write scope and works on forks. Skipped
  # outside pull requests, which reports success to a required check.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Review the dependencies this pull request changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development
          comment-summary-in-pr: never

  # gitleaks over the commits this event adds, from the digest-pinned stage
  # of .github/tools/Dockerfile, offline. --redact is not optional: this
  # repository's Actions logs are public, so a finding prints its rule, file,
  # line and commit and never the match, and the report is not uploaded.
  # scheduled.yml scans the whole history weekly.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Both ends of every range below have to be in the clone.
          fetch-depth: 0
          persist-credentials: false

      - name: Build the pinned gitleaks image
        run: docker build --target gitleaks -t vr-gitleaks .github/tools

      - name: Scan the commits this event adds
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
          MQ_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          is_sha() { [[ "$1" =~ ^[0-9a-f]{40}$ ]]; }
          zero=0000000000000000000000000000000000000000
          case "$EVENT_NAME" in
            pull_request)
              FROM="$PR_BASE"
              TO="$PR_HEAD"
              ;;
            push)
              TO="$PUSH_AFTER"
              # A new branch has no before, and a force push's before can be
              # gone from history: scan what the branch adds to main instead.
              if is_sha "$PUSH_BEFORE" && [ "$PUSH_BEFORE" != "$zero" ] &&
                git cat-file -e "${PUSH_BEFORE}^{commit}" 2> /dev/null; then
                FROM="$PUSH_BEFORE"
              else
                FROM=origin/main
              fi
              ;;
            merge_group)
              FROM="$MQ_BASE"
              TO="$MQ_HEAD"
              ;;
            *)
              echo "::notice::A $EVENT_NAME run scans no range: scheduled.yml scans the whole history weekly."
              exit 0
              ;;
          esac
          # The range becomes git log arguments inside gitleaks, so each end
          # has to be a commit id (or main itself), never an option.
          if ! is_sha "$TO" || { [ "$FROM" != origin/main ] && ! is_sha "$FROM"; }; then
            echo "::error::The event did not give two commit ids to scan between."
            exit 1
          fi
          RANGE="${FROM}..${TO}"
          echo "Scanning ${RANGE}"

          report_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$report_dir"
          status=0
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            -v "$PWD:/repo" -v "$report_dir:/report" -w /repo \
            vr-gitleaks git --redact --no-banner --exit-code 1 --config .gitleaks.toml \
            --log-opts "$RANGE" --report-format json --report-path /report/gitleaks.json ||
            status=$?

          case "$status" in
            0)
              echo "No secrets in ${RANGE}."
              echo "Secret scan: nothing found in \`${RANGE}\`." >> "$GITHUB_STEP_SUMMARY"
              ;;
            1)
              # Rule, file, line and commit only. The report holds the
              # redacted match too, and stays on the runner. A file name is a
              # pull request author's choice, so anything but plain path
              # characters becomes _ before it reaches a workflow command.
              jq -r '.[] | "::error file=\(.File | gsub("[^A-Za-z0-9._/+@-]"; "_")),line=\(.StartLine)::\(.RuleID) in commit \(.Commit)"' "$report_dir/gitleaks.json"
              {
                echo "### Secret scan found something in \`${RANGE}\`"
                echo ""
                echo "| Rule | File | Line | Commit |"
                echo "|---|---|---|---|"
                jq -r '.[] | "| \(.RuleID) | \(.File | gsub("[^A-Za-z0-9._/+@-]"; "_")) | \(.StartLine) | \(.Commit) |"' "$report_dir/gitleaks.json"
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::gitleaks found a secret in ${RANGE}. Remove it from the history, rotate it, or list its fingerprint in .gitleaksignore with the reason above it."
              exit 1
              ;;
            *)
              echo "::error::gitleaks could not run (exit $status)."
              exit 1
              ;;
          esac

  # Every workflow, the scan-gate action's script and the three Dockerfiles,
  # read by the tools that know their languages. The tools run as digest-pinned
  # images built from .github/tools/Dockerfile, offline, and their exceptions
  # are in .github/actionlint.yaml, .github/zizmor.yml and .hadolint.yaml, each
  # with its reason. No path filter, so it runs on every pull request and can
  # be a required check.
  config-lint:
    name: Workflow and Dockerfile lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # Nothing is installed: the script has no dependencies.
          package-manager-cache: false

      - name: Build the pinned linters
        run: |
          set -euo pipefail
          docker build --target actionlint -t vr-actionlint .github/tools
          docker build --target zizmor -t vr-zizmor .github/tools
          docker build --target hadolint -t vr-hadolint .github/tools

      - name: Lint the workflows (actionlint, with shellcheck)
        # Reads .github/actionlint.yaml. shellcheck and pyflakes are in the
        # image, so the shell and Python inside every run: block are checked.
        run: docker run --rm -v "$PWD:/repo" -w /repo vr-actionlint -color

      - name: Shellcheck the scan-gate action's script
        # actionlint does not read a composite action, and this script is the
        # one users run in their own pipelines with their own API key.
        run: |
          set -euo pipefail
          node scripts/ci/extract-action-script.mjs .github/actions/scan-gate/action.yml > "$RUNNER_TEMP/scan-gate.sh"
          docker run --rm --entrypoint shellcheck -v "$RUNNER_TEMP:/w" vr-actionlint -s bash -S warning /w/scan-gate.sh

      - name: Audit the workflows and the action (zizmor)
        # The token is read-only and also present on pull requests from forks.
        # It lets zizmor's online audits ask GitHub whether a pinned commit is
        # really on its tag, whether it is an impostor, and whether the action
        # has a known vulnerability. Reads .github/zizmor.yml.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker run --rm -e GH_TOKEN -v "$PWD:/repo" -w /repo vr-zizmor --min-severity medium .github/workflows .github/actions

      - name: Lint the Dockerfiles (hadolint)
        # Reads .hadolint.yaml. Only an error fails; a warning is printed.
        run: docker run --rm -v "$PWD:/repo" -w /repo vr-hadolint hadolint --failure-threshold error Dockerfile tests/spike/Dockerfile .github/tools/Dockerfile
