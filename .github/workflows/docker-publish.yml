name: Build, Sign, and Publish Docker Image

on:
  push:
    tags:
      - "v*"

# release: two tags pushed close together used to race on `:latest`,
# so whichever build finished last won regardless of which version it was.
# Serialise the whole workflow. cancel-in-progress stays false: a cancelled
# run would leave a pushed version tag with no signature and no SBOM.
concurrency:
  group: docker-publish
  cancel-in-progress: false

# Nothing at the top level: each job states its own scopes.
permissions: {}

# release: the identity a user's `cosign verify` accepts for the image,
# defined once. SECURITY.md "Verifying a Release" quotes it exactly, and
# docker-publish-arm64.yml carries the same string, because the multi-arch
# index is re-signed there from the default branch.
# tests/repo/release-identities.test.ts holds every copy equal. Dots are
# written [.] so the string has no backslash in any file it is copied into.
env:
  IMAGE_SIGNER_IDENTITY: "^https://github[.]com/VulnRadar/vulnradar[.]dev/[.]github/workflows/(docker-publish[.]yml@refs/tags/v[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z.-]+)?|docker-publish-arm64[.]yml@refs/heads/main)$"
  SIGNER_OIDC_ISSUER: https://token.actions.githubusercontent.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # The CI gate below waits up to 45 minutes, and the build, sign and SBOM
    # steps take 6 to 8 more.
    timeout-minutes: 60
    # security: this job holds packages: write and an OIDC token and signs
    # what it builds, so it reads no Actions cache and writes none. A cache
    # entry is whatever the last job with a write token to that scope put
    # there, and BuildKit would have built the signed image on top of it.
    cache-mode: none

    permissions:
      contents: read
      packages: write
      # Required for cosign keyless signing (OIDC token exchange).
      id-token: write
      # Read CI's runs for the tagged commit (the gate below).
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags: the ":latest" decision below compares this
          # tag against every other release tag in the repository.
          fetch-depth: 0
          # security: nothing here pushes with git. The CI gate reads runs
          # with GH_TOKEN, and `git tag --list` and `git rev-parse` are local
          # after a full fetch, so no token stays behind in .git/config for
          # the Docker build of this tree or a later step to find.
          persist-credentials: false

      # security: the same anchored pattern release.yml applies, before
      # anything logs in or pushes. `v*` matched v4.0.0-rc_1, which got an
      # amd64 image pushed and signed that release.yml then refused to
      # release.
      - name: Check the tag's shape
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          TAG_PATTERN='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          if [[ ! "$TAG" =~ $TAG_PATTERN ]]; then
            echo "::error::The pushed tag is not a version tag (vX.Y.Z or vX.Y.Z-suffix); refusing to publish it."
            exit 1
          fi

      # release: nothing required the commit being published to have passed
      # CI. A tag pushed on a red commit, or pushed seconds after the commit
      # while CI was still running, built, signed and published an image, then
      # release.yml turned it into a GitHub release that every instance's
      # updater offers. Branch protection would not have helped: tags are not
      # merges. Wait for CI on this exact commit, and publish only on success.
      - name: Require a green CI run for the tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          # CI takes about fifteen minutes; a tag pushed right after its commit
          # has to wait for it rather than fail.
          deadline=$(( $(date +%s) + 45 * 60 ))
          while :; do
            runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${sha}&per_page=20" \
              --jq '[.workflow_runs[] | {status, conclusion}]')
            if echo "$runs" | jq -e 'any(.[]; .conclusion == "success")' > /dev/null; then
              echo "CI passed for ${sha}."
              break
            fi
            if echo "$runs" | jq -e 'length > 0 and all(.[]; .status == "completed")' > /dev/null; then
              # A stopped run says nothing about the code, and "fix main" sent
              # people hunting for a failure that never happened.
              if echo "$runs" | jq -e 'all(.[]; .conclusion == "cancelled")' > /dev/null; then
                echo "::error::CI was cancelled for ${sha}, so it never reported on this commit: rerun CI for this sha, then re-run this workflow."
                exit 1
              fi
              echo "::error::CI did not pass for ${sha}: ${runs}. Fix main, then tag the fixed commit."
              exit 1
            fi
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::No successful CI run for ${sha} within 45 minutes. Push the commit to main, let CI finish, then re-run this workflow."
              exit 1
            fi
            echo "Waiting for CI on ${sha}: ${runs}"
            sleep 30
          done

      # No QEMU step. It was here to emulate linux/arm64 back when this job
      # built both platforms at once, and it outlived that: the build below is
      # `platforms: linux/amd64` on an amd64 runner, which is native, and
      # arm64 moved to docker-publish-arm64.yml on a native ARM runner (where
      # it takes 4.6 minutes instead of the 27 it took under emulation here).
      # So the step installed an emulator that nothing then asked to emulate
      # anything, on every release, and dependabot kept opening PRs to keep it
      # current. Removing it is the honest version of merging those.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Pinned by digest, the same reference as the buildkit stage of
          # .github/tools/Dockerfile, which Dependabot keeps current. The
          # default is the floating buildx-stable-1 tag, resolved at release
          # time inside the job that signs.
          driver-opts: image=moby/buildkit:v0.35.0@sha256:aa632b921ef07411d2cb77292cd34213d4f7b384001d6fceef1e1f25bf9752bb

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        # release: the installer is pinned by commit, and that commit names
        # the cosign release it downloads and verifies, so the signing binary
        # only moves when Dependabot moves this line.
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # release: nothing used to check that the tag being published agreed
      # with the version the code reports. A tag pushed without the matching
      # bump produces an image that permanently reports itself "behind":
      # app/api/version/route.ts serves CONFIG_APP_VERSION, the self-updater
      # compares that against the newest GitHub tag, so every instance is
      # offered the update it already has, forever. Fail here instead, before
      # anything is pushed or signed.
      - name: Assert the tag matches the version in the code
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          TAG_VERSION="${TAG_VERSION%%-*}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          CFG_VERSION=$(grep -m1 -oE 'CONFIG_APP_VERSION = "[^"]+"' lib/config/config-values.ts | sed 's/.*"\(.*\)"/\1/')
          echo "tag=${TAG_VERSION} package.json=${PKG_VERSION} CONFIG_APP_VERSION=${CFG_VERSION}"
          if [ "${TAG_VERSION}" != "${PKG_VERSION}" ] || [ "${TAG_VERSION}" != "${CFG_VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json (${PKG_VERSION}) and CONFIG_APP_VERSION (${CFG_VERSION}). Bump both, commit, then re-tag."
            exit 1
          fi
          # The changelog the app and the release notes read must have an entry
          # for the version being published. Only the version: the date is
          # taken from the GitHub release after it ships.
          if ! grep -qxF '    version: "'"${TAG_VERSION}"'",' lib/changelog/data.ts; then
            echo "::error::lib/changelog/data.ts has no entry for ${TAG_VERSION}. Add one, commit, then re-tag."
            exit 1
          fi

      - name: Extract version from tag
        id: vars
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      - name: Convert owner to lowercase
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      # release: `:latest` used to move on ANY v* tag. The repository
      # already carries tags like v1.9.4-patch.1, and app/api/version reads
      # the GitHub "latest release", so cutting a release candidate or a
      # backport for an older line republished it as the newest version and
      # every self-hosted updater offered it as an upgrade. Only a clean
      # vMAJOR.MINOR.PATCH that is also the highest such tag may move
      # `:latest` now; anything else publishes its own version tag only.
      - name: Decide whether this tag becomes :latest
        id: latest
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${GITHUB_REF_NAME} is a prerelease or suffixed tag, so :latest is left where it is."
            exit 0
          fi
          HIGHEST=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ "${HIGHEST}" = "${GITHUB_REF_NAME}" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${GITHUB_REF_NAME} is older than ${HIGHEST}, so :latest is left where it is."
          fi

      - name: Assemble image tags
        id: tags
        env:
          PUBLISH_LATEST: ${{ steps.latest.outputs.publish }}
        run: |
          IMAGE=ghcr.io/${OWNER_LC}/vulnradar
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          {
            echo "list<<EOF"
            echo "${IMAGE}:${VERSION}"
            if [ "${PUBLISH_LATEST}" = "true" ]; then echo "${IMAGE}:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # release: amd64 only, on purpose. This used to build both platforms in
      # one step, and the arm64 leg runs under QEMU: on v3.8.0 it spent over
      # 40 minutes on `npm ci` alone before reaching `npm run build`, and the
      # GitHub release could not be created until it finished, because
      # release.yml waits on this workflow.
      #
      # arm64 is still published. docker-publish-arm64.yml builds it after
      # this workflow succeeds and merges it into these same tags as a
      # multi-arch index, so `docker compose up -d` on a Pi or an Ampere box
      # still resolves. The difference is that arm64 arrives a little after
      # the release rather than holding it up.
      - name: Build and push image index
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          # arm64 is added later by docker-publish-arm64.yml. See above.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          # No layer cache (cache-mode: none above). The amd64 build had no
          # cache hits on v3.9.1 anyway. If build time ever matters, the
          # reviewed alternative is a registry cache under
          # ghcr.io/vulnradar/vulnradar:buildcache-amd64, which only a
          # packages: write token can write.
          # release: a cosign signature attests WHO signed, not what went
          # into the artifact. `mode=max` makes buildkit attach a full SLSA
          # provenance attestation to the pushed index (source repo, commit,
          # the build steps and their materials), so a consumer can check
          # that this image really came from this workflow on this commit
          # and not just that someone with the right OIDC identity signed
          # it. Verify with
          # `cosign verify-attestation --type slsaprovenance ...` or
          # `docker buildx imagetools inspect --format '{{ json .Provenance }}'`.
          provenance: mode=max
          # security: empty on purpose. Next.js inlines NEXT_PUBLIC_* at build
          # time, so a value here was compiled into every pulled image, and a
          # self-hosted instance's reset, verification and invite links could
          # point at the upstream site with a live token in them. Server code
          # reads the origin at run time now. A self-hoster who wants their
          # own origin in the client bundles still builds the image themselves
          # (`docker compose build app`), which is why docker-compose.yml
          # carries a build context. See .env.example.
          build-args: |
            NEXT_PUBLIC_APP_URL=

      - name: Sign image with cosign (keyless)
        # release: keyless signing via Sigstore Fulcio + Rekor. No
        # long-lived private key to manage. Sign the image index BY DIGEST,
        # not by tag: one signature then covers every tag pointing at it
        # (:VERSION and, when it moved, :latest) and cannot be invalidated
        # by a later tag move. Consumers still verify by tag, since
        # `cosign verify ...:v3.8.0` resolves the tag to this digest.
        #
        # infra: use OWNER_LC (set above), not github.repository_owner
        # directly -- OCI references must be lowercase and the raw
        # context value mirrors the org's display casing, which is not
        # guaranteed to be lowercase.
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"

      # release: nothing used to run the command SECURITY.md gives users, so
      # a documented identity that no signature carried went unnoticed: the
      # multi-arch index is signed by docker-publish-arm64.yml from the
      # default branch, which the documented docker-publish.yml regexp never
      # matched. Verify the digest just signed with the same identity and
      # issuer users are told to pass. A few attempts absorb the registry and
      # Rekor catching up with the signature.
      - name: Verify the signature the way SECURITY.md tells users to
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if cosign verify \
              --certificate-identity-regexp "$IMAGE_SIGNER_IDENTITY" \
              --certificate-oidc-issuer "$SIGNER_OIDC_ISSUER" \
              "${IMAGE}@${DIGEST}" > /dev/null; then
              echo "Verified ${IMAGE}@${DIGEST} with the identity SECURITY.md documents."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Verification attempt ${attempt} failed; retrying in 15 seconds."
              sleep 15
            fi
          done
          echo "::error::cosign verify with the identity SECURITY.md documents failed for ${IMAGE}@${DIGEST}, so a user following SECURITY.md could not verify this image."
          exit 1

      - name: Generate SBOM (CycloneDX, JSON)
        # release: CycloneDX SBOM is the most widely consumed format.
        # `anchore/sbom-action` runs syft on the built image and writes
        # the SBOM next to the build artifacts.
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/${{ env.OWNER_LC }}/vulnradar:${{ github.ref_name }}
          format: cyclonedx-json
          # infra: anchore/sbom-action uploads this artifact itself
          # (under this exact name) -- it never writes the file into
          # github.workspace, so a separate upload-artifact step here
          # would never find anything to upload. release.yml downloads
          # this artifact directly by name.
          artifact-name: vulnradar-${{ github.ref_name }}.sbom.cdx.json
