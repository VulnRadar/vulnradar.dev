# VulnRadar scan gate for GitLab CI.
#
# Scans a URL with VulnRadar and fails the pipeline when findings cross a
# severity threshold. The finding IDs are stable, so this gates a merge request
# the same way the GitHub Action does.
#
# Use it one of two ways:
#
#   1) include it (recommended, stays up to date):
#        include:
#          - remote: "https://vulnradar.dev/gitlab/vulnradar-scan.gitlab-ci.yml"
#        vulnradar_scan:
#          variables:
#            VR_URL: "https://your-staging-url.com"
#
#   2) or copy this whole job into your own .gitlab-ci.yml.
#
# Required: add VULNRADAR_TOKEN as a MASKED CI/CD variable
# (Settings > CI/CD > Variables). Create the token in VulnRadar under
# Profile > Developer > API Keys. Never hardcode it in this file.
#
# Everything else is set through the variables below (shown with defaults);
# override them on the job.
#
# Exit codes match the vulnradar CLI: 1 means the scan ran and a threshold was
# exceeded, 2 means the scan could not run (missing token, network, API
# error, timeout), 3 means it ran but did not check the target (see
# VR_FAIL_ON_INCOMPLETE). To let tool failures through while still blocking on
# findings, add to the job:
#   allow_failure:
#     exit_codes: [2]

vulnradar_scan:
  stage: test
  image: alpine:3.20
  variables:
    VR_URL: "" # required: the URL to scan
    VR_API_BASE: "https://vulnradar.dev/api/v3" # self-hosting? point at your own /api/v3
    # "true" crawls and scans several pages instead of just the one URL.
    # How many is your plan's crawl page limit.
    VR_CRAWL: "false"
    VR_MAX_CRITICAL: "0" # fail if criticals exceed this
    VR_MAX_HIGH: "0" # fail if highs exceed this
    VR_MAX_MEDIUM: "-1" # fail if mediums exceed this; -1 disables the check
    # "true" counts findings you marked a false positive. Off, they are left
    # out, matching the dashboard and the reports.
    VR_INCLUDE_SUPPRESSED: "false"
    # What to do when part of the target was not checked.
    #   blocking  exit 3 when the site showed the scanner a bot challenge or
    #             the page could not be fetched: a scan that never saw the
    #             page proves nothing.
    #   any       exit 3 when any area at all was skipped.
    #   never     only report what was skipped.
    # It is "never" so that a pipeline that includes this file does not start
    # failing when the file changes. Set "blocking" to opt in.
    VR_FAIL_ON_INCOMPLETE: "never"
    # Give up waiting after this many seconds. Empty follows the scan: 300,
    # or 900 with VR_CRAWL, matching the larger budget the server gives a
    # crawl.
    VR_TIMEOUT: ""
    VR_POLL_INTERVAL: "5" # seconds between status polls
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      set -eu

      if [ -z "${VULNRADAR_TOKEN:-}" ]; then
        echo "VULNRADAR_TOKEN is not set. Add it as a masked CI/CD variable."; exit 2
      fi
      if [ -z "${VR_URL:-}" ]; then
        echo "VR_URL is empty. Set it to the URL you want scanned."; exit 2
      fi
      # Checked before the scan is started and charged. A threshold that is
      # not a number made the comparisons below error out, and an errored
      # test inside `if` is just false, so the gate passed.
      for pair in "VR_MAX_CRITICAL:${VR_MAX_CRITICAL:-}" "VR_MAX_HIGH:${VR_MAX_HIGH:-}"; do
        case "${pair#*:}" in
          ''|*[!0-9]*) echo "${pair%%:*} must be 0 or more, got '${pair#*:}'."; exit 2 ;;
        esac
      done
      # An empty VR_MAX_MEDIUM means "no medium check", like the default. Any
      # negative number disables it, as it does in the CLI: only a value that
      # is not a number is refused.
      if [ -z "${VR_MAX_MEDIUM:-}" ]; then VR_MAX_MEDIUM=-1; fi
      case "${VR_MAX_MEDIUM#-}" in
        ''|*[!0-9]*) echo "VR_MAX_MEDIUM must be a number (a negative one disables the check), got '$VR_MAX_MEDIUM'."; exit 2 ;;
      esac
      case "$VR_INCLUDE_SUPPRESSED" in
        true|false) ;;
        *) echo "VR_INCLUDE_SUPPRESSED must be true or false, got '$VR_INCLUDE_SUPPRESSED'."; exit 2 ;;
      esac
      case "$VR_FAIL_ON_INCOMPLETE" in
        blocking|any|never) ;;
        *) echo "VR_FAIL_ON_INCOMPLETE must be blocking, any or never, got '$VR_FAIL_ON_INCOMPLETE'."; exit 2 ;;
      esac
      if [ -z "${VR_TIMEOUT:-}" ]; then
        if [ "$VR_CRAWL" = "true" ]; then VR_TIMEOUT=900; else VR_TIMEOUT=300; fi
      fi

      if [ "$VR_CRAWL" = "true" ]; then
        endpoint="$VR_API_BASE/scan/crawl"
      else
        endpoint="$VR_API_BASE/scan"
      fi

      # Start the scan. POST /scan runs as a background job and returns only a
      # scanId, never findings -- the result appears on GET /scan/status/{id}.
      # jq builds the body: a URL interpolated into a JSON string broke the
      # request on the first double quote or backslash in it.
      body=$(jq -n --arg url "$VR_URL" '{url: $url}')
      code=$(curl -sS -o resp.json -w '%{http_code}' -X POST "$endpoint" \
        -H "Authorization: Bearer $VULNRADAR_TOKEN" \
        -H "Content-Type: application/json" \
        -d "$body" || echo 000)
      if [ "$code" -ge 300 ] || [ "$code" = "000" ]; then
        echo "Failed to start scan (HTTP $code): $(cat resp.json 2>/dev/null)"; exit 2
      fi
      scan_id=$(jq -r '.scanId' resp.json)
      if [ -z "$scan_id" ] || [ "$scan_id" = "null" ]; then
        echo "No scanId in response: $(cat resp.json)"; exit 2
      fi
      # The id goes into the status path. A reply with a slash or a dot
      # segment in it sent the polls, token and all, to another path on the
      # API host. Scan ids are hex or decimal, so anything else is refused,
      # and not echoed.
      case "$scan_id" in
        *[!A-Za-z0-9_-]*) echo "The API returned a scan id that cannot be used in a URL."; exit 2 ;;
      esac
      echo "Started scan $scan_id for $VR_URL"

      # Poll until it completes.
      elapsed=0
      done=false
      failures=0
      while [ "$elapsed" -lt "$VR_TIMEOUT" ]; do
        code=$(curl -sS -o status.json -w '%{http_code}' \
          -H "Authorization: Bearer $VULNRADAR_TOKEN" \
          "$VR_API_BASE/scan/status/$scan_id" || echo 000)
        if [ "$code" = "401" ] || [ "$code" = "403" ]; then
          echo "Not authorized to read scan $scan_id (HTTP $code)."; exit 2
        fi
        # A scan polls about sixty times, a crawl closer to two hundred, so
        # one 502 from a proxy used to fail a pipeline for a scan that was
        # succeeding. Up to five failures in a row are retried, as the CLI does.
        if [ "$code" -ge 300 ] || [ "$code" = "000" ]; then
          failures=$((failures + 1))
          if [ "$failures" -gt 5 ]; then
            echo "Lost contact with the API while polling scan $scan_id (HTTP $code)."; exit 2
          fi
          echo "Status poll failed (HTTP $code); retrying ($failures/5)."
          sleep "$VR_POLL_INTERVAL"
          elapsed=$((elapsed + VR_POLL_INTERVAL))
          continue
        fi
        failures=0
        status=$(jq -r '.status' status.json)
        if [ "$status" = "completed" ]; then done=true; break; fi
        if [ "$status" = "failed" ]; then
          reason=$(jq -r '.error // "unknown error"' status.json)
          # Why it failed, when the API says. Appended last so the
          # "Scan failed: " prefix is unchanged, and an older server that
          # sends no kind adds nothing.
          kind=$(jq -r '(.failureKind | strings) // empty' status.json)
          if [ -n "$kind" ]; then reason="$reason [$kind]"; fi
          echo "Scan failed: $reason"; exit 2
        fi
        sleep "$VR_POLL_INTERVAL"
        elapsed=$((elapsed + VR_POLL_INTERVAL))
      done
      if [ "$done" != "true" ]; then
        echo "Timed out after ${VR_TIMEOUT}s waiting for scan $scan_id to complete."; exit 2
      fi

      # Fail closed. A missing summary read as zeros would pass a response
      # this script did not understand, and a gate that cannot judge must not
      # pass.
      if ! jq -e '(.result | type) == "object" and (.result.summary | type) == "object"' status.json > /dev/null; then
        echo "Scan $scan_id completed but its result has no summary object, so the thresholds cannot be judged."; exit 2
      fi

      # The counts the gate judges, the same rule as the vulnradar CLI
      # (cli/lib.mjs gateCounts): taken from the findings, leaving out the
      # ones you marked a false positive unless VR_INCLUDE_SUPPRESSED is
      # "true". The summary counts them, so gating on it failed the next run
      # on a finding the dashboard and the reports had hidden. With no
      # findings array it falls back to the summary.
      gate_counts_jq='
        .result as $r
        | (if ($r.findings | type) == "array" then [$r.findings[] | objects] else null end) as $all
        | if $all == null then
            { critical: ($r.summary.critical // 0), high: ($r.summary.high // 0),
              medium: ($r.summary.medium // 0), low: ($r.summary.low // 0),
              total: ($r.summary.total // 0), suppressed: 0 }
          else
            [$all[] | select($inc or (.suppressed != true))] as $kept
            | { critical: ([$kept[] | select(.severity == "critical")] | length),
                high: ([$kept[] | select(.severity == "high")] | length),
                medium: ([$kept[] | select(.severity == "medium")] | length),
                low: ([$kept[] | select(.severity == "low")] | length),
                total: ($kept | length),
                suppressed: (($all | length) - ($kept | length)) }
          end
      '
      counts=$(jq -c --argjson inc "$VR_INCLUDE_SUPPRESSED" "$gate_counts_jq" status.json)
      critical=$(echo "$counts" | jq -r '.critical')
      high=$(echo "$counts" | jq -r '.high')
      medium=$(echo "$counts" | jq -r '.medium')
      low=$(echo "$counts" | jq -r '.low')
      total=$(echo "$counts" | jq -r '.total')
      suppressed=$(echo "$counts" | jq -r '.suppressed')
      echo "Scan complete: critical=$critical high=$high medium=$medium low=$low total=$total"
      if [ "$suppressed" -gt 0 ]; then
        echo "$suppressed suppressed by false-positive verdicts, not counted (VR_INCLUDE_SUPPRESSED=true counts them)."
      fi

      # What the scan did not look at. bot-challenge and page-unreachable mean
      # the target was never read, so zero findings proves nothing.
      incomplete=$(jq -r '[(.result.incomplete // [])[]? | strings] | join(",")' status.json)
      incomplete_blocking=false
      if [ -n "$incomplete" ]; then
        echo "Not checked: $incomplete"
        page_message=$(jq -r '(.result.pageUnreachable | objects | .message | strings) // empty' status.json)
        redirect_host=$(jq -r '(.result.pageUnreachable | objects | .redirectHost | strings) // empty' status.json)
        if [ -n "$page_message" ]; then echo "Page unreachable: $page_message"; fi
        if [ -n "$redirect_host" ]; then echo "It redirects to another host: $redirect_host"; fi
        case ",$incomplete," in
          *,bot-challenge,*|*,page-unreachable,*) incomplete_blocking=true ;;
        esac
        if [ "$VR_FAIL_ON_INCOMPLETE" = "any" ]; then incomplete_blocking=true; fi
        if [ "$VR_FAIL_ON_INCOMPLETE" = "never" ]; then incomplete_blocking=false; fi
      fi

      fail=false
      if [ "$critical" -gt "$VR_MAX_CRITICAL" ]; then
        echo "$critical critical finding(s) exceed the max of $VR_MAX_CRITICAL"; fail=true
      fi
      if [ "$high" -gt "$VR_MAX_HIGH" ]; then
        echo "$high high finding(s) exceed the max of $VR_MAX_HIGH"; fail=true
      fi
      if [ "$VR_MAX_MEDIUM" -ge 0 ] && [ "$medium" -gt "$VR_MAX_MEDIUM" ]; then
        echo "$medium medium finding(s) exceed the max of $VR_MAX_MEDIUM"; fail=true
      fi

      if [ "$fail" = "true" ]; then exit 1; fi

      # After the thresholds, so a failed gate is reported as one.
      if [ "$incomplete_blocking" = "true" ]; then
        echo "The scan did not check the target ($incomplete). A pass here would mean nothing was looked at. Set VR_FAIL_ON_INCOMPLETE to never to accept a partial scan."; exit 3
      fi
