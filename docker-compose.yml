# VulnRadar Production Docker Compose
# Uses pre-built image from GHCR for easy deployment
# For development with custom Turnstile keys, use: docker compose -f docker-compose.dev.yml up -d
#
# Quick start:
#   1. Copy .env.example to .env and fill in values
#   2. docker compose up -d
#
# Generate an API key encryption key:
#   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"

services:
  # PostgreSQL Database
  # infra: pin to a specific minor (16.4). Bump intentionally; for
  # an immutable build, replace with `postgres:16.4-alpine@sha256:<digest>`
  # (pull + `docker images --digests` to fetch the digest).
  postgres:
    image: postgres:16.15-alpine
    container_name: vulnradar-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vulnradar}
      POSTGRES_USER: ${POSTGRES_USER:-vulnradar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vulnradar}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vulnradar-network

  # VulnRadar Application
  # infra: pin to a specific version tag instead of `:latest`
  # (mutable). Self-hosters should bump intentionally and read the
  # changelog before pulling.
  #
  # The tag MUST carry the leading `v`. docker-publish.yml tags the image
  # from `github.ref_name`, which is the release tag (`v3.8.0`), so a bare
  # `3.8.0` has never existed in the registry and fails on `manifest
  # unknown` before anything else in the stack starts.
  #
  # To pin to an immutable digest instead:
  #   1. `docker pull ghcr.io/vulnradar/vulnradar:v3.8.2`
  #   2. `docker images --digests ghcr.io/vulnradar/vulnradar`
  #   3. Replace the tag below with `ghcr.io/vulnradar/vulnradar@sha256:<digest>`
  app:
    image: ghcr.io/vulnradar/vulnradar:v3.8.2
    build:
      # Lets `docker compose build app` work from a source checkout, which is
      # what the self-hosting upgrade docs tell operators to run. Without a
      # build context the documented upgrade path is a silent no-op.
      context: .
      dockerfile: Dockerfile
      args:
        # Build-time, not runtime: Next.js inlines NEXT_PUBLIC_* into the client
        # bundle when the image is built, so these have no effect if passed
        # only under environment:.
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
        # Client components can only read NEXT_PUBLIC_* values, and Next.js
        # inlines them at build time, so these have to be passed here rather
        # than as runtime environment.
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
        # Fork/rebrand overrides for the community and extension-store links.
        # Left empty they fall back to the upstream VulnRadar listings.
        NEXT_PUBLIC_DISCORD_INVITE_URL: ${NEXT_PUBLIC_DISCORD_INVITE_URL:-}
        NEXT_PUBLIC_CHROME_WEB_STORE_URL: ${NEXT_PUBLIC_CHROME_WEB_STORE_URL:-}
        NEXT_PUBLIC_FIREFOX_ADDON_URL: ${NEXT_PUBLIC_FIREFOX_ADDON_URL:-}
    container_name: vulnradar-app
    # The explicit `environment:` map below only forwards the variables named
    # in it, which was 11 of the ~48 the app actually reads: everything else
    # an operator set in .env (OAuth client ids, AI provider keys, Browserbase,
    # Discord, GitHub App, SEO verification, and so on) was silently dropped,
    # so those features looked broken with no indication why. The docs already
    # told operators the app "reads .env via env_file", which was simply not
    # true. env_file forwards the whole file; the map below then adds the
    # values that are derived from compose itself (the in-network Postgres URL)
    # or need a default, and takes precedence where both define a key.
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-vulnradar}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vulnradar}
      DATABASE_SSL: "false"
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      # API key encryption. Required: lib/config/env.ts refuses to start
      # without exactly 64 hex chars, and instrumentation.ts validates before
      # anything else runs. This used to default to an empty string, so the
      # most commonly missed self-host variable produced the least legible
      # failure: `docker compose up -d` reported success and the container
      # crash-looped, indistinguishable at `docker compose ps` from an
      # unreachable database. `:?` fails at compose parse time instead, and
      # names the variable and the command that generates one.
      API_KEY_ENCRYPTION_KEY: ${API_KEY_ENCRYPTION_KEY:?Set API_KEY_ENCRYPTION_KEY in .env to 64 hex chars. Generate one with the node command at the top of this file.}
      # SMTP (optional, for emails)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Contact form
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      # Server-side half of the support address (outgoing email). The
      # client-side half is the NEXT_PUBLIC_SUPPORT_EMAIL build arg above:
      # both read the same SUPPORT_EMAIL from your .env, so setting it once
      # covers emails and the UI.
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      # Turnstile CAPTCHA (optional)
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
    volumes:
      # Both of these are on the container's throwaway writable layer without
      # a mount, and the documented upgrade (`docker compose pull && docker
      # compose up -d`) recreates the container, so every backup and every
      # legacy avatar file was lost on each update. The Dockerfile creates
      # both directories owned by the runtime user, so a fresh named volume
      # inherits that ownership.
      #
      # backup_data backs BACKUP_DIR, which defaults to <cwd>/backups for
      # both the admin Backup button and scripts/backup-db.mjs. Point
      # BACKUP_DIR somewhere else only if you also mount that path.
      - backup_data:/app/backups
      # avatar_data holds the legacy on-disk avatars that
      # lib/uploads/avatar-migration.ts imports into the database. Keeps them
      # out of the build-time-baked public/ dir.
      - avatar_data:/app/data/avatars
    ports:
      # infra: bind to localhost by default. The compose assumes a
      # reverse proxy (nginx / Caddy / Cloudflare Tunnel) is in
      # front of the app. Override with HOST_BIND=0.0.0.0 to expose
      # the app port on all interfaces (e.g. bare metal LAN).
      - "${HOST_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # /api/v3/health checks database connectivity; /api/version only
      # checks GitHub's releases API, so a dead database would report
      # healthy forever on that endpoint and restart: unless-stopped
      # would never fire.
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/api/v3/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - vulnradar-network

volumes:
  postgres_data:
    driver: local
  backup_data:
    driver: local
  avatar_data:
    driver: local

networks:
  vulnradar-network:
    driver: bridge
